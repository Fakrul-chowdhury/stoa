<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stoa</title>
<meta name="description" content="Daily journal, mood, energy and goals.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stoa">
<meta name="theme-color" content="#F5F5F5" id="theme-color">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#121212; --muted:#5F6B78; --line:#E2E4E8; --line-strong:#C3C9D0;
  --accent:#F05454; --accent-soft:#FDE6E6; --navy:#30475E; --on-navy:#F5F5F5; --energy:#30475E;
  --feature:#30475E; --on-feature:#F5F5F5;
  --scrim:rgba(18,18,18,.45);
  --m1:#30475E; --m2:#5E7389; --m3:#A9B2BC; --m4:#F59C91; --m5:#F05454;
  --f1:#F5F5F5; --f2:#F5F5F5; --f3:#121212; --f4:#121212; --f5:#121212;
  --serif:ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --ease-sheet:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --ink:#F5F5F5; --muted:#A1A1A1; --line:#272727; --line-strong:#444444;
    --accent-soft:#3A1F1F; --navy:#F5F5F5; --on-navy:#121212; --energy:#8C8C8C; --scrim:rgba(0,0,0,.62);
    --feature:#232323; --on-feature:#F5F5F5;
    --m1:#606060; --m2:#888888; --m3:#B4B4B4; --f2:#121212;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --ink:#F5F5F5; --muted:#A1A1A1; --line:#272727; --line-strong:#444444;
  --accent-soft:#3A1F1F; --navy:#F5F5F5; --on-navy:#121212; --energy:#8C8C8C; --scrim:rgba(0,0,0,.62);
  --feature:#232323; --on-feature:#F5F5F5;
  --m1:#606060; --m2:#888888; --m3:#B4B4B4; --f2:#121212;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,.btn{transition:transform .2s var(--ease),opacity .2s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:inherit}
.muted{color:var(--muted)}
.small{font-size:14px}

main{max-width:560px;margin:0 auto;padding:18px 20px 120px}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 22px}
.greet{margin:0 0 2px;color:var(--muted);font-size:15px}
.date{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.streak{display:flex;align-items:center;gap:5px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.streak svg{width:18px;height:18px;fill:var(--line-strong);transition:fill .4s var(--ease)}
.streak:active{transform:scale(.96)}
.streak.lit svg{fill:var(--accent)}
.streak b{font-size:17px;font-variant-numeric:tabular-nums}
.streak span{font-size:13px;color:var(--muted)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex-shrink:0}
.icon-btn:active{background:var(--line);transform:scale(.9)}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Quote strip on Today */
.qstrip{display:block;width:100%;text-align:left;margin:0 0 26px;padding:2px 0 2px 14px;border-left:3px solid var(--accent)}
.qstrip q{display:block;font-family:var(--serif);font-size:17px;line-height:1.45;quotes:none}
.qstrip span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.qstrip:active{opacity:.6}

/* Mood */
.mood-top{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.face-big{flex-shrink:0;line-height:0}
.face-big.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.86)}100%{transform:scale(1)}}
.mood-q{font-family:var(--serif);font-size:22px;line-height:1.25;font-weight:600}
.mood-now{margin:4px 0 0;color:var(--muted);font-size:15px}
.mood-now b{color:var(--ink);font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:14px}
.mood-btn .f{line-height:0;border-radius:50%;padding:3px;box-shadow:0 0 0 2px transparent;transition:box-shadow .3s var(--ease),transform .3s var(--spring)}
.mood-btn span:last-child,.en-btn span:last-child{font-size:13px;color:var(--muted);transition:color .25s var(--ease)}
.mood-btn[aria-checked="true"] .f{box-shadow:0 0 0 2px var(--ink)}
.mood-btn[aria-checked="true"] span:last-child,.en-btn[aria-checked="true"] span:last-child{color:var(--ink);font-weight:600}
.mood-btn:active .f{transform:scale(.92)}

/* Energy */
.en-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:14px;border:1px solid transparent}
.en-btn:active{transform:scale(.95)}
.en-btn svg{width:30px;height:24px;display:block}
.en-btn rect{fill:var(--line);transition:fill .3s var(--ease)}
.en-btn rect.on{fill:var(--muted)}
.en-btn[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.en-btn[aria-checked="true"] rect.on{fill:var(--accent)}

/* Sections */
.block{margin-top:32px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:17px;font-weight:650}
.save-state{font-size:13px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:14px}

/* Journal page */
.page{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 8px;transition:border-color .25s var(--ease)}
.page:focus-within{border-color:var(--line-strong)}
.prompt-row{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.prompt{margin:0;flex:1;font-family:var(--serif);font-size:18px;line-height:1.45}
textarea.entry-input{display:block;width:100%;min-height:170px;border:0;background:transparent;resize:none;outline:none;font-family:var(--serif);font-size:18px;line-height:1.7;padding:6px 0 12px}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.7}

/* Goals */
.goal-list{list-style:none;margin:0;padding:0}
.goal{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:first-child{border-top:1px solid var(--line)}
.check{width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0}
.check:active{transform:scale(.86)}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .2s var(--ease),transform .4s var(--spring)}
.goal.done .check{background:var(--accent);border-color:var(--accent)}
.goal.done .check svg{opacity:1;transform:scale(1)}
.goal-main{flex:1;min-width:0;text-align:left;padding-top:1px}
.goal-text{display:block;overflow-wrap:anywhere;transition:color .3s var(--ease)}
.goal.done .goal-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.goal-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;font-size:13px;color:var(--muted)}
.goal-meta span{display:inline-flex;align-items:center;gap:4px}
.goal-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.goal-meta .due{color:var(--accent);font-weight:600}
.del{width:30px;height:30px;display:grid;place-items:center;color:var(--line-strong);border-radius:50%;flex-shrink:0}
.del svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.del:active{color:var(--ink);background:var(--line);transform:scale(.9)}
.goal-empty{margin:0;padding:12px 0;color:var(--muted);font-size:15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.goal-add{display:flex;gap:8px;margin-top:12px}
.goal-add input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .25s var(--ease)}
.goal-add input:focus{border-color:var(--navy)}
.btn-add{padding:0 16px;border-radius:12px;background:var(--navy);color:var(--on-navy);font-weight:600;font-size:15px}
.btn-add:active,.chip:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;background:var(--surface)}
.chip b{color:var(--accent);font-weight:700;margin-right:3px}
.chip.ghost{border-style:dashed;color:var(--muted);background:none}
.move{margin-top:12px}

/* Progress bars */
.goal{flex-wrap:wrap}
.goal-prog{flex-basis:100%;display:flex;align-items:center;gap:10px;padding:8px 0 0 36px}
.bar{flex:1;min-width:0;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .45s var(--ease)}
.prog-n{min-width:40px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-size:18px;line-height:1}
.step:active{transform:scale(.88)}
.num-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.num-row span{font-size:15px}
.num-row .input{width:120px;text-align:center}
input[type=range]{display:block;width:100%;margin:4px 0 0;accent-color:var(--accent)}

/* Swipe a goal: right to tick it off, left to send it to tomorrow */
.goal{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.goal>*{position:relative;z-index:1;transform:translateX(var(--sx,0))}
.goal-prog{transition:transform .3s var(--ease)}
.goal.swiping,.goal[data-swipe]{overflow:hidden}
.goal.swiping>*{transform:translateX(var(--sx,0))!important;transition:none!important}
.goal::before{content:"";position:absolute;inset:3px 0;border-radius:12px;background:var(--accent);opacity:calc(var(--sp,0)*.92);pointer-events:none}
.goal[data-swipe="move"]::before{background:var(--line-strong)}
.goal[data-swipe]::after{position:absolute;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:#fff;opacity:var(--sp,0);pointer-events:none;transition:transform .2s var(--spring)}
.goal[data-swipe="done"]::after{content:"Done";left:16px}
.goal[data-swipe="step"]::after{content:"+1";left:16px}
.goal[data-swipe="move"]::after{content:"Tomorrow";right:16px}
.goal.armed::after{transform:translateY(-50%) scale(1.18)}
.goal.flash::before{animation:goal-flash .8s var(--ease)}
@keyframes goal-flash{from{opacity:.55}to{opacity:0}}
.bar.bump{animation:bar-bump .4s var(--spring)}
@keyframes bar-bump{50%{transform:scaleY(1.7)}}
.swipe-hint{margin:10px 0 0}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
#fx i{position:absolute;display:block;border-radius:2px}

/* Long-term goals */
.lg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.lg-main{display:block;width:100%;text-align:left}
.lg-main:active{opacity:.55}
.lg-title{display:block;font-family:var(--serif);font-size:19px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.lg-meta{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.lg-meta.due{color:var(--accent)}
.lg-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.lg-set{justify-content:space-between;margin-top:4px}

/* Streak goals: a stack of stones that grows the longer the streak runs */
.sk-main{display:flex;align-items:center;gap:14px}
.sk-art{flex-shrink:0;line-height:0}
.sk-body{flex:1;min-width:0}
.sk-count{display:block;margin-top:2px;font-size:15px;color:var(--muted)}
.sk-count b{margin-right:3px;font-family:var(--serif);font-size:30px;line-height:1.1;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sk-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.sk-slip{color:var(--muted);font-weight:500;white-space:nowrap}
.sk-slip[data-sure]{color:var(--accent);font-weight:600}
.st{transform-box:fill-box;transform-origin:center}
.sk.fall .st{animation:stone-fall .65s cubic-bezier(.5,0,.9,.5) forwards;animation-delay:calc((8 - var(--i))*35ms)}
@keyframes stone-fall{to{transform:translate(calc(var(--dx)*1px),70px) rotate(calc(var(--dx)*4deg));opacity:0}}
.sk.new .st.top{animation:stone-drop .7s var(--spring)}
@keyframes stone-drop{from{transform:translateY(-40px);opacity:0}}
.sk-hero{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.sk-hero .sk-count b{font-size:44px}
.lg-set .step{width:38px;height:38px;font-size:20px}
.lg-slide{position:relative;flex:1;min-width:0;height:40px;padding:0 11px;display:flex;align-items:center;touch-action:pan-y;cursor:grab;border-radius:12px;-webkit-user-select:none;user-select:none}
.lg-slide .bar{height:10px}
.lg-slide .bar i{width:calc(var(--p,0)*100%)}
.lg-knob{position:absolute;top:50%;left:calc(11px + (100% - 22px)*var(--p,0));width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:left .45s var(--ease),transform .2s var(--ease)}
.lg-slide.drag{cursor:grabbing}
.lg-slide.drag .bar i,.lg-slide.drag .lg-knob{transition:none}
.lg-slide.drag .lg-knob{transform:scale(1.18)}
.lg-num{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;color:var(--muted);white-space:nowrap}
.lg-num input{width:60px;padding:8px 4px;text-align:center;font-size:16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);outline:none;-moz-appearance:textfield;appearance:textfield;transition:border-color .25s var(--ease)}
.lg-num input::-webkit-outer-spin-button,.lg-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lg-num input:focus{border-color:var(--navy)}
.lg-tick{width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:var(--accent)}
.saved-row .lg-tick svg{width:14px;height:14px;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.peb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.peb i{display:block;width:34px;height:26px;border-radius:50%;border:2px dashed var(--line-strong);transition:background-color .4s var(--ease),transform .2s var(--ease)}
.peb:active i{transform:scale(.9)}
.peb.on i{border:0}
.peb span{font-size:12px;color:var(--muted)}
.peb.today span{color:var(--ink);font-weight:700}

/* Page headers */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 20px}
.page-head h1{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.15}
.page-head p{margin:4px 0 0}
.search{width:100%;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .25s var(--ease)}
.search:focus{border-color:var(--navy)}

/* Journal list */
.month{font-family:var(--serif);font-size:20px;font-weight:600;margin:26px 0 4px}
.entry{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:active,.saved-row:active,.qbody:active{opacity:.55}
.entry .f{line-height:0;flex-shrink:0;padding-top:2px}
.entry-body{flex:1;min-width:0;display:block}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry-date{font-weight:600}
.entry-meta{font-size:13px;color:var(--muted);white-space:nowrap}
/* Photos */
.sec-tools{display:flex;align-items:center;gap:4px;align-self:center}
.sec-head .icon-btn{margin:-10px -8px -10px 0}
.head-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ph-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.ph-strip::-webkit-scrollbar{display:none}
.ph-thumb{flex:0 0 auto;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--line)}
.ph-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.ph-thumb:active{transform:scale(.95)}
.ph-preview{display:block;width:100%;max-height:42vh;object-fit:contain;border-radius:14px;background:var(--surface);margin-bottom:16px}
/* App lock: covers everything until the passcode is entered */
.lock{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .3s var(--ease)}
.lock.out{opacity:0;pointer-events:none}
.lock-in{width:100%;max-width:320px;text-align:center}
.lock-logo{display:block;width:56px;height:56px;border-radius:14px;margin:0 auto 18px}
.lock-title{margin:0;font-family:var(--serif);font-size:24px;line-height:1.25;font-weight:600}
.lock-dots{display:flex;justify-content:center;gap:18px;margin:22px 0 8px}
.lock-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transition:background-color .15s}
.lock-dots i.on{background:var(--ink)}
.lock-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lock-msg{min-height:22px;margin:0 0 16px;font-size:14px;color:var(--accent)}
.lock-note{margin:12px 0 22px;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;justify-items:center}
.keypad button{width:74px;height:74px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--line-strong);transform:scale(.94)}
.keypad .kp-text{border:0;background:none;font-size:15px;font-weight:600;color:var(--muted)}
.keypad button:disabled{opacity:.35}
.keypad .kp-bio{color:var(--ink)}
.keypad .kp-bio svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lock-forgot{margin-top:20px;color:var(--muted);font-weight:500}
.viewer{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;background:#000;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}

const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);};
const dowName=(d,style)=>new Date(2024,0,7+d).toLocaleDateString(undefined,{weekday:style});
const fmtTime=t=>{if(!t)return "";const p=t.split(":").map(Number);return new Date(2000,0,1,p[0],p[1]).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const EASE="cubic-bezier(.22,1,.36,1)";
// Grow or collapse a row so a list doesn't jump when something is added or removed.
function slideIn(el){
  if(reduceMotion.matches||!el.animate)return;
  const cs=getComputedStyle(el);
  el.style.overflow="hidden";
  const a=el.animate([{height:"0px",paddingTop:"0px",paddingBottom:"0px",opacity:0},{height:el.offsetHeight+"px",paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,opacity:1}],{duration:320,easing:EASE});
  const done=()=>{el.style.overflow="";};
  a.onfinish=a.oncancel=done;setTimeout(done,500); // the timer covers a backgrounded app, where animations pause
}
// Hide a block that stays in the page (slideOut removes it instead).
function collapse(el){
  if(reduceMotion.matches||!el.animate){el.hidden=true;return;}
  const cs=getComputedStyle(el);
  el.style.overflow="hidden";
  const a=el.animate([{height:el.offsetHeight+"px",paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,opacity:1},{height:"0px",paddingTop:"0px",paddingBottom:"0px",opacity:0}],{duration:240,easing:EASE,fill:"forwards"});
  const done=()=>{if(el._col!==a)return;el._col=null;el.hidden=true;el.style.overflow="";a.cancel();};
  el._col=a;a.onfinish=done;setTimeout(done,500);
}
function expand(el){
  el._col=null;
  if(el.getAnimations)el.getAnimations().forEach(a=>a.cancel());
  el.hidden=false;slideIn(el);
}
function slideOut(el){
  el._leaving=true;el.style.pointerEvents="none";
  if(reduceMotion.matches||!el.animate){el.remove();return;}
  const cs=getComputedStyle(el);
  el.style.overflow="hidden";
  const a=el.animate([{height:el.offsetHeight+"px",paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,opacity:1},{height:"0px",paddingTop:"0px",paddingBottom:"0px",opacity:0}],{duration:260,easing:EASE,fill:"forwards"});
  const done=()=>el.remove();
  a.onfinish=a.oncancel=done;setTimeout(done,500);
}

let TODAY=keyOf(new Date());
const tomorrowKey=()=>addDays(TODAY,1);

/* =========================================================
   Data (stored only on this device)
   ========================================================= */
const blankDay=()=>({mood:0,energy:0,text:"",prompt:-1,goals:[],seeded:[],gone:0,photos:[],updatedAt:0});
const cleanPhotos=a=>Array.isArray(a)?a.map(String).filter(Boolean).slice(0,200):[]; // ids of pictures kept in the photo store
// A goal with a target is finished in steps: prog counts up to target, and it is done when they meet.
const cleanTarget=t=>{t=Math.round(Number(t)||0);return t>=2?Math.min(t,9999):0;};
const cleanLongTarget=t=>{t=Math.round(Number(t)||0);return t>=2?Math.min(t,100000):0;};
const clamp=(v,max)=>Math.max(0,Math.min(max,Math.round(Number(v)||0)));
function cleanGoal(g){
  const o={id:String(g.id||newId()),text:g.text.slice(0,300),done:!!g.done,rid:g.rid?String(g.rid):undefined};
  const t=cleanTarget(g.target);
  if(t){o.target=t;o.prog=clamp(g.prog,t);o.done=o.prog>=t;}
  return o;
}
const newGoal=r=>Object.assign({id:newId(),text:r.text,done:false,rid:r.id},r.target?{target:r.target,prog:0}:{});
function setTarget(g,t){
  if(!t){if(g.target){delete g.target;delete g.prog;}return;}
  const p=g.done?t:Math.min(g.target?g.prog:0,t); // a finished goal stays finished
  g.target=t;g.prog=p;g.done=p>=t;
}
function cleanDay(r){
  r=r||{};
  return {
    mood:[1,2,3,4,5].includes(r.mood)?r.mood:0,
    energy:[1,2,3,4,5].includes(r.energy)?r.energy:0,
    text:typeof r.text==="string"?r.text:"",
    prompt:Number.isInteger(r.prompt)&&r.prompt>=0&&r.prompt<PROMPTS.length?r.prompt:-1,
    goals:Array.isArray(r.goals)?r.goals.filter(g=>g&&typeof g.text==="string").map(cleanGoal):[],
    gone:clamp(r.gone,100000), // finished goals later cleared from the list; they still count in Insights
    seeded:Array.isArray(r.seeded)?r.seeded.map(String):[],
    photos:cleanPhotos(r.photos),
    updatedAt:Number(r.updatedAt)||0
  };
}
function cleanRoutine(r){
  const f=FREQS.some(x=>x[0]===r.freq)?r.freq:"once";
  return {id:String(r.id||newId()),text:String(r.text||"").slice(0,300),freq:f,days:Array.isArray(r.days)?r.days.filter(d=>d>=0&&d<=6):[],time:/^\d{2}:\d{2}$/.test(r.time||"")?r.time:"",target:cleanTarget(r.target),lastUsed:Number(r.lastUsed)||0,createdAt:Number(r.createdAt)||Date.now()};
}
function cleanLong(g){
  const c=Number(g.createdAt)||Date.now(),base={id:String(g.id||newId()),text:String(g.text||"").slice(0,300),createdAt:c,updatedAt:Number(g.updatedAt)||c};
  if(g.kind==="streak"){
    // A streak counts the days since `start`. A slip moves `start` to now; `best` keeps the longest run.
    return Object.assign(base,{kind:"streak",start:Math.min(Number(g.start)||c,Date.now()),best:clamp(g.best,100000),slips:Array.isArray(g.slips)?g.slips.map(Number).filter(Boolean).slice(-200):[],seen:clamp(g.seen,9),
      pct:false,target:1,prog:0,due:"",doneAt:0});
  }
  const pct=!!g.pct,target=pct?100:(cleanLongTarget(g.target)||10);
  const o=Object.assign(base,{pct,target,prog:clamp(g.prog,target),due:KEY_RE.test(g.due||"")?g.due:"",doneAt:Number(g.doneAt)||0});
  if(o.doneAt)o.prog=target;else if(o.prog>=target)o.doneAt=o.updatedAt;
  return o;
}
function cleanNote(n){const c=Number(n.createdAt)||Date.now();return {id:String(n.id||newId()),text:String(n.text||""),photos:cleanPhotos(n.photos),createdAt:c,updatedAt:Number(n.updatedAt)||c};}
function cleanQuote(q){return {id:String(q.id||newId()),text:String(q.text||"").slice(0,2000),author:String(q.author||"").slice(0,120),note:String(q.note||"").slice(0,4000),fav:!!q.fav,createdAt:Number(q.createdAt)||Date.now()};}
function load(){
  let raw={};
  try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{};}catch(e){}
  const days={};
  for(const k in (raw.days||{}))if(KEY_RE.test(k))days[k]=cleanDay(raw.days[k]);
  return {
    profile:{name:raw.profile&&typeof raw.profile.name==="string"?raw.profile.name:"",onboarded:!!(raw.profile&&raw.profile.onboarded)},
    settings:{theme:raw.settings&&["system","light","dark"].includes(raw.settings.theme)?raw.settings.theme:"system",swiped:!!(raw.settings&&raw.settings.swiped)},
    days,
    routines:(raw.routines||[]).map(cleanRoutine).filter(r=>r.text),
    quotes:(raw.quotes||[]).map(cleanQuote).filter(q=>q.text),
    notes:(raw.notes||[]).map(cleanNote).filter(n=>n.text.trim()||n.photos.length),
    longs:(raw.longs||[]).map(cleanLong).filter(g=>g.text)
  };
}
const S=load();
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);saveTimer=null;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){toast("Couldn't save. Your phone may be low on storage.");}
  pushSoon();
}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,300);}

const getDay=k=>S.days[k]||blankDay();
const ensureDay=k=>S.days[k]||(S.days[k]=blankDay());
const routine=id=>S.routines.find(r=>r.id===id);
const checkedIn=d=>!!d&&(d.mood>0||d.energy>0||(d.text||"").trim().length>0||(d.photos||[]).length>0);
const hasContent=d=>!!d&&(checkedIn(d)||d.goals.length>0);
const promptIdx=k=>{const d=getDay(k);return d.prompt>=0?d.prompt:hash(k)%PROMPTS.length;};

function streaks(){
  let cur=0,k=TODAY;
  const todayDone=checkedIn(S.days[TODAY]);
  if(!todayDone)k=addDays(k,-1);
  while(checkedIn(S.days[k])){cur++;k=addDays(k,-1);}
  const ks=Object.keys(S.days).filter(x=>x<=TODAY&&checkedIn(S.days[x])).sort();
  let best=0,run=0,prev=null;
  for(const x of ks){run=(prev&&addDays(prev,1)===x)?run+1:1;if(run>best)best=run;prev=x;}
  return {cur,best,total:ks.length,todayDone};
}

/* Recurring goals --------------------------------------- */
function repeatsOn(r,k){
  const d=parseKey(k).getDay();
  switch(r.freq){
    case "daily":return true;
    case "weekdays":return d>=1&&d<=5;
    case "weekends":return d===0||d===6;
    case "custom":return r.days.includes(d);
    default:return false;
  }
}
function seedDay(k){
  if(k<TODAY)return false;
  let changed=false;
  for(const r of S.routines){
    if(r.freq==="once"||!repeatsOn(r,k))continue;
    const d=getDay(k);
    if(d.seeded.includes(r.id)||d.goals.some(g=>g.rid===r.id))continue;
    const day=ensureDay(k);
    day.goals.push(newGoal(r));
    day.seeded.push(r.id);
    changed=true;
  }
  return changed;
}
function seedUpcoming(){const a=seedDay(TODAY),b=seedDay(tomorrowKey());if(a||b)save();}
function freqLabel(r){
  if(!r)return "";
  if(r.freq==="custom"){
    const ds=WEEK_ORDER.filter(d=>r.days.includes(d));
    return ds.length?ds.map(d=>dowName(d,"short")).join(", "):"";
  }
  const f=FREQS.find(x=>x[0]===r.freq);
  return r.freq==="once"?"":f[1];
}
function findOrCreateRoutine(text){
  const t=text.trim();
  let r=S.routines.find(x=>x.text.toLowerCase()===t.toLowerCase());
  if(!r){r=cleanRoutine({text:t,freq:"once"});S.routines.push(r);}
  r.lastUsed=Date.now();
  return r;
}

/* =========================================================
   Mutations
   ========================================================= */
function mutate(k,fn,slow){
  const before=streaks();
  const d=ensureDay(k);
  fn(d);
  d.updatedAt=Date.now();
  if(slow)saveSoon();else save();
  renderAll(slow);
  const after=streaks();
  if(!before.todayDone&&after.todayDone){
    toast(after.cur===1?"Checked in. Your streak starts today.":"Checked in. "+after.cur+"-day streak.");
  }
}
function addGoalText(k,text){
  const t=text.trim();if(!t)return false;
  const r=findOrCreateRoutine(t);
  if(getDay(k).goals.some(g=>g.rid===r.id&&!g.done)){toast("That goal is already on the list.");return false;}
  mutate(k,d=>{d.goals.push(newGoal(r));});
  return true;
}
function tickGoal(k,id,li){
  let all=false,now=false;
  mutate(k,d=>{
    const g=d.goals.find(x=>x.id===id);if(!g)return;
    if(!g.target)g.done=!g.done;
    else if(g.done){g.prog=Math.min(g.was||0,g.target-1);g.done=false;} // back to where it was before the tick
    else{g.was=g.prog;g.prog=g.target;g.done=true;}
    now=g.done;all=g.done&&d.goals.every(x=>x.done);
  });
  if(now)goalFx(li);
  if(all&&k===TODAY){toast("All of today's goals done. Nice work.");confetti();}
}
function stepGoal(k,id,by,li){
  let all=false,now=false,moved=false;
  mutate(k,d=>{
    const g=d.goals.find(x=>x.id===id);if(!g||!g.target)return;
    const was=g.done,p=g.prog;
    g.prog=clamp(g.prog+by,g.target);g.done=g.prog>=g.target;
    moved=g.prog>p;now=!was&&g.done;all=now&&d.goals.every(x=>x.done);
  });
  if(now)goalFx(li);
  else if(moved&&li){const b=$(".bar",li);if(b){b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");}}
  if(all&&k===TODAY){toast("All of today's goals done. Nice work.");confetti();}
}
// Carry unfinished goals from today into tomorrow, keeping any progress made.
function moveToTomorrow(ids){
  const tm=tomorrowKey(),left=getDay(TODAY).goals.filter(g=>!g.done&&(!ids||ids.includes(g.id)));
  if(!left.length)return 0;
  mutate(tm,d=>{left.forEach(g=>{
    const ex=d.goals.find(x=>!x.done&&(x.rid&&x.rid===g.rid||x.text.toLowerCase()===g.text.toLowerCase()));
    if(!ex)d.goals.push(Object.assign({id:newId(),text:g.text,done:false,rid:g.rid},g.target?{target:g.target,prog:g.prog}:{}));
    else if(g.target){ex.target=g.target;ex.prog=Math.max(ex.prog||0,g.prog);ex.done=ex.prog>=ex.target;}
  });});
  mutate(TODAY,d=>{d.goals=d.goals.filter(g=>!left.includes(g));});
  return left.length;
}

function face(m,size){
  const c=m?(m-3)*7:0;
  const fill=m?"var(--m"+m+")":"none";
  const feat=m?"var(--f"+m+")":"var(--line-strong)";

  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true"><circle cx="50" cy="50" r="'+(m?47:45)+'" fill="'+fill+'"'+ring+'/>'+
    '<circle cx="36" cy="42" r="4.6" fill="'+feat+'"/><circle cx="64" cy="42" r="4.6" fill="'+feat+'"/>'+
    '<path d="M32 '+(64-c/2)+' Q50 '+(64+c*1.5)+' 68 '+(64-c/2)+'" stroke="'+feat+'" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
}
function bars(level){
  let s='<svg viewBox="0 0 30 24" aria-hidden="true">';
  for(let i=0;i<5;i++){const h=6+i*4.5;s+='<rect'+(i<level?' class="on"':"")+' x="'+(i*6.2)+'" y="'+(24-h)+'" width="4.4" height="'+h+'" rx="1.4"/>';}
  return s+"</svg>";
}

function updateMood(el,k){

  if(el.firstChild){
    // Already built: update in place so the selection animates instead of jumping.
    if(el._m===m)return;
    el._m=m;
    $$(".mood-btn",el).forEach((b,i)=>b.setAttribute("aria-checked",m===i+1));
    if(hero){$("[data-face]",el).innerHTML=face(m,104);$(".mood-now",el).innerHTML=m?'Feeling <b>'+MOODS[m-1].toLowerCase()+'</b> today':'Tap a face to log your mood';}
    else $(".sec-head span",el).textContent=m?MOODS[m-1]:"Not logged";

  }

    ?'<div class="mood-top"><div class="face-big" data-face>'+face(m,104)+'</div><div><h2 class="mood-q">How are you feeling?</h2><p class="mood-now">'+(m?'Feeling <b>'+MOODS[m-1].toLowerCase()+'</b> today':'Tap a face to log your mood')+'</p></div></div>'

function autosize(ta){ta.style.height="auto";ta.style.height=Math.max(170,ta.scrollHeight)+"px";}
function goalMeta(g,k){
  const r=g.rid&&routine(g.rid);
  if(!r)return "";
  const parts=[];
  const fl=freqLabel(r);
  if(fl)parts.push('<span>'+I.repeat+esc(fl)+'</span>');
  if(r.time){
    const due=k===TODAY&&!g.done&&nowHM()>=r.time;
    parts.push('<span'+(due?' class="due"':'')+'>'+I.bell+esc(fmtTime(r.time))+(due?", due":"")+'</span>');
  }
  return parts.length?'<span class="goal-meta">'+parts.join("")+'</span>':"";
}
function updateGoals(k){
  const d=getDay(k),n=d.goals.length,done=d.goals.filter(g=>g.done).length;
  const emptyMsg=k===TODAY?"No goals for today yet. Add one below.":k===tomorrowKey()?"What do you want to get done tomorrow?":"No goals for this day.";
  // Update rows in place (rather than rebuilding the list) so ticks animate and rows slide in and out.
  $$('[data-goal-list="'+k+'"]').forEach(ul=>{
    const first=!ul._ready;ul._ready=true;
    const old=new Map();
    $$("li.goal",ul).forEach(li=>{if(!li._leaving)old.set(li.dataset.gid,li);});
    let empty=$(".goal-empty",ul);
    if(!n){
      old.forEach(li=>slideOut(li));
      if(!empty){empty=document.createElement("li");empty.className="goal-empty";ul.appendChild(empty);if(!first)slideIn(empty);}
      empty.textContent=emptyMsg;
      return;
    }
    if(empty)empty.remove();
    let prev=null;
    d.goals.forEach(g=>{
      let li=old.get(g.id),fresh=false;
      if(li){old.delete(g.id);li.classList.toggle("done",g.done);li.firstChild.setAttribute("aria-checked",g.done);}
      else{
        fresh=!first;
        li=document.createElement("li");li.className="goal"+(g.done?" done":"");li.dataset.gid=g.id;
        li.innerHTML='<button class="check" data-toggle="'+esc(g.id)+'" data-key="'+k+'" role="checkbox" aria-checked="'+g.done+'">'+I.check+'</button>'+
          '<button class="goal-main" data-edit-goal="'+esc(g.id)+'" data-key="'+k+'"></button>'+
          '<button class="del" data-del="'+esc(g.id)+'" data-key="'+k+'" aria-label="Remove goal">'+I.x+'</button>';
      }
      const inner='<span class="goal-text">'+esc(g.text)+'</span>'+goalMeta(g,k);
      if(li._inner!==inner){
        li._inner=inner;li.children[1].innerHTML=inner;
        li.firstChild.setAttribute("aria-label","Mark done: "+g.text);
        li.children[1].setAttribute("aria-label","Goal settings: "+g.text);
      }
      const pg=g.target?g.prog+"/"+g.target:"";
      if(li._pg!==pg){
        li._pg=pg;
        let box=li.children[3];
        if(!g.target){if(box)box.remove();}
        else{
          if(!box){
            box=document.createElement("div");box.className="goal-prog";
            box.innerHTML='<button class="step" data-step="-1" data-gid="'+esc(g.id)+'" data-key="'+k+'" aria-label="One less">&minus;</button><div class="bar"><i></i></div><span class="prog-n"></span>'+
              '<button class="step" data-step="1" data-gid="'+esc(g.id)+'" data-key="'+k+'" aria-label="One more">+</button>';
            li.appendChild(box);
          }
          $("i",box).style.width=(g.prog/g.target*100)+"%";
          $(".prog-n",box).textContent=pg;
        }
      }
      let ref=prev?prev.nextSibling:ul.firstChild;
      while(ref&&ref._leaving)ref=ref.nextSibling;
      if(ref!==li)ul.insertBefore(li,ref);
      prev=li;
      if(fresh)slideIn(li);
    });

  });

  if(k===TODAY)$$("[data-swipe-hint]").forEach(h=>h.hidden=!n||S.settings.swiped);
  $$('[data-move="'+k+'"]').forEach(b=>{const left=n-done;b.hidden=!left;b.textContent="Move "+left+" unfinished to tomorrow";});
  const inDay=new Set(d.goals.map(g=>g.rid).filter(Boolean));
  const avail=S.routines.filter(r=>!inDay.has(r.id)).sort((a,b)=>b.lastUsed-a.lastUsed).slice(0,12);

}

function buildJournal(){

    '<input type="search" class="search" data-search placeholder="Search entries, notes and goals" aria-label="Search entries"><div data-jlist></div>';

function renderJournal(){
  const q=($("[data-search]").value||"").trim().toLowerCase();
  const keys=Object.keys(S.days).filter(k=>k<=TODAY&&hasContent(S.days[k]));
  const count=[];
  if(keys.length)count.push(keys.length+" day"+(keys.length===1?"":"s")+" recorded");
  if(S.notes.length)count.push(S.notes.length+" note"+(S.notes.length===1?"":"s"));
  $("[data-jcount]").textContent=count.join(", ");
  const list=$("[data-jlist]");
  if(!keys.length&&!S.notes.length){list.innerHTML='<div class="empty"><p>Your entries will show up here. Start with how today is going, or write an open note about anything.</p><div class="btn-row"><button class="btn primary" data-tab="today">Write today\'s entry</button><button class="btn" data-new-note>Write a note</button></div></div>';return;}
  // Daily entries and open notes share one timeline.
  const items=[];
  keys.forEach(k=>{const d=S.days[k];if(!q||d.text.toLowerCase().includes(q)||d.goals.some(g=>g.text.toLowerCase().includes(q)))items.push({k,day:d,at:Infinity});});
  S.notes.forEach(n=>{if(!q||n.text.toLowerCase().includes(q))items.push({k:keyOf(new Date(n.createdAt)),note:n,at:n.createdAt});});
  if(!items.length){list.innerHTML='<div class="empty"><p>No entries match "'+esc(q)+'".</p></div>';return;}
  // Newest day first; within a day, the daily entry, then notes from latest to earliest.
  items.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:b.at-a.at);
  let html="",month="";
  for(const it of items){
    const k=it.k;
    const mo=fmt(k,{month:"long",year:"numeric"});
    if(mo!==month){html+='<h2 class="month">'+esc(mo)+'</h2>';month=mo;}
    const date=esc(k===TODAY?"Today":fmt(k,{weekday:"short",day:"numeric",month:"short"}));
    if(it.note){
      const nt=it.note;
      html+='<button class="entry" data-open-note="'+esc(nt.id)+'"><span class="note-ic">'+I.pen+'</span><span class="entry-body">'+
        '<span class="entry-top"><span class="entry-date">'+date+'</span><span class="entry-meta">'+esc("Note, "+new Date(nt.createdAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))+'</span></span>'+
        '<span class="entry-text">'+esc(nt.text.trim()||photoCount(nt.photos))+'</span></span></button>';
      continue;
    }
    const d=it.day;
    const n=d.goals.length,done=d.goals.filter(g=>g.done).length;
    const meta=[];if(d.energy)meta.push(ENERGY[d.energy-1]+" energy");if(n)meta.push(done+"/"+n+" goals");
    const pc=(d.photos||[]).length;if(pc&&d.text.trim())meta.push(photoCount(d.photos));
    const excerpt=d.text.trim()||(pc?photoCount(d.photos):d.mood||d.energy?"Checked in, no journal entry.":n+" goal"+(n===1?"":"s")+" set.");
    html+='<button class="entry" data-open-day="'+k+'"><span class="f">'+face(d.mood,40)+'</span><span class="entry-body">'+
      '<span class="entry-top"><span class="entry-date">'+date+'</span><span class="entry-meta">'+esc(meta.join(", "))+'</span></span>'+
      '<span class="entry-text">'+esc(excerpt)+'</span></span></button>';
  }
  list.innerHTML=html;
}

/* Streaks ------------------------------------------------- */
const STONES=[1,3,7,14,30,60,90,180,365]; // days at which a streak earns its next stone
const ST_W=[66,58,51,45,39,34,29,25,21],ST_H=[13,12,11,10,10,9,9,8,8],ST_X=[0,2,-2,1,-1,2,-1,1,0];
const streakDays=g=>Math.max(0,Math.floor((Date.now()-g.start)/864e5));
const stonesFor=d=>STONES.filter(m=>d>=m).length;
const dayWord=d=>d+(d===1?" day":" days");
// The headline figure: whole days, or hours and minutes on the first day.
function streakBig(g){
  const ms=Math.max(0,Date.now()-g.start),d=Math.floor(ms/864e5),h=Math.floor(ms/36e5),m=Math.floor(ms/6e4);
  return d?[d,d===1?"day":"days"]:h?[h,h===1?"hour":"hours"]:[m,m===1?"minute":"minutes"];
}
// The stack. Earned stones are solid (the newest in the accent colour); dotted outlines show the
// next stone to earn and how tall the best run stood.
function cairn(stones,best,size){
  const upto=Math.min(9,Math.max(best,stones+1));
  let y=101,svg='<svg viewBox="0 0 100 106" width="'+size+'" height="'+Math.round(size*1.06)+'" aria-hidden="true"><path d="M14 102.5h72" stroke="var(--line-strong)" stroke-width="2" stroke-linecap="round"/>';
  for(let i=0;i<upto;i++){
    const h=ST_H[i],at='cx="'+(50+ST_X[i])+'" cy="'+(y-h/2)+'"',top=i===stones-1;
    svg+=i<stones
      ?'<ellipse class="st'+(top?" top":"")+'" style="--i:'+i+';--dx:'+(i%2?16:-16)+'" '+at+' rx="'+ST_W[i]/2+'" ry="'+h/2+'" fill="'+(top?"var(--accent)":"var(--ink)")+'"'+(top?'':' opacity="'+(i%2?.7:.92)+'"')+'/>'
      :'<ellipse '+at+' rx="'+(ST_W[i]/2-.75)+'" ry="'+(h/2-.75)+'" fill="none" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="3 3"/>';
    y-=h-1;
  }
  return svg+"</svg>";
}
function streakCard(g,isNew){
  const d=streakDays(g),st=stonesFor(d),best=Math.max(g.best,d),next=STONES[st],prev=st?STONES[st-1]:0,big=streakBig(g);
  const frac=next?Math.max(0,Math.min(1,((Date.now()-g.start)/864e5-prev)/(next-prev))):1;
  const note=best>d?"Best run "+dayWord(best):g.slips.length?"Your longest run so far":"Since "+new Date(g.start).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  return '<div class="lg sk'+(isNew?" new":"")+'"><button class="lg-main sk-main" data-open-long="'+esc(g.id)+'"><span class="sk-art">'+cairn(st,stonesFor(best),76)+'</span>'+
    '<span class="sk-body"><span class="lg-title">'+esc(g.text)+'</span><span class="sk-count"><b>'+big[0]+'</b>'+big[1]+'</span><span class="lg-meta">'+esc(note)+'</span></span></button>'+
    '<div class="lg-row"><div class="bar"><i style="width:'+frac*100+'%"></i></div></div>'+
    '<div class="sk-foot"><span class="muted small">'+esc(next?"Next stone at "+dayWord(next)+(next-d>1?", "+(next-d)+" to go":""):"Every stone earned. Keep going.")+'</span>'+
    '<button class="link sk-slip" data-slip="'+esc(g.id)+'">I slipped</button></div></div>';
}
// A slip knocks the stack down and starts the count again; the best run is kept.
function slipStreak(g,card){
  const d=streakDays(g);
  g.best=Math.max(g.best,d);g.slips.push(Date.now());if(g.slips.length>200)g.slips.shift();
  g.start=Date.now();g.seen=0;g.updatedAt=Date.now();save();
  toast(d?"Reset after "+dayWord(d)+". Begin again.":"Reset. Begin again.");
  const redraw=()=>{if(currentTab==="goals")renderLongs();};
  if(card&&!reduceMotion.matches){card.classList.add("fall");setTimeout(redraw,760);}else redraw();
}

function renderLongs(){
  const el=$("#view-goals");
  // A streak that has reached a new stone since it was last looked at gets its moment.
  let earned=null,changed=false;
  S.longs.forEach(g=>{
    if(g.kind!=="streak")return;
    const st=stonesFor(streakDays(g));
    if(st>g.seen)earned=g;
    if(st!==g.seen){g.seen=st;changed=true;}
  });
  if(changed)save();
  if(earned){toast(dayWord(STONES[earned.seen-1])+" on "+earned.text+". A new stone.");confetti();}
  const rank=g=>g.kind==="streak"?"0":"1"+(g.due||"9999");
  const act=S.longs.filter(g=>!g.doneAt).sort((a,b)=>rank(a).localeCompare(rank(b))||a.createdAt-b.createdAt);
  const fin=S.longs.filter(g=>g.doneAt).sort((a,b)=>b.doneAt-a.doneAt);
  const html='<header class="page-head"><div><h1>Goals</h1><p class="muted">'+(S.longs.length?"Long-term, "+act.length+" in progress"+(fin.length?", "+fin.length+" completed":""):"Long-term")+'</p></div><button class="btn primary" data-new-long>'+I.plus+'New goal</button></header>';
  if(!S.longs.length){
    el.innerHTML=html+'<div class="empty"><p>The bigger things you\'re working toward: a project, a number to hit, or a streak you want to keep, like days without smoking.</p><button class="btn primary" data-new-long>Add your first goal</button></div>';
    return;
  }
  el.innerHTML=html+(act.map(g=>g.kind==="streak"?streakCard(g,g===earned):longCard(g)).join("")||'<p class="muted">Everything here is done. Add the next one when you\'re ready.</p>')+
    (fin.length?'<h2 class="month">Completed</h2><div>'+fin.map(g=>
      '<button class="saved-row" data-open-long="'+esc(g.id)+'"><span class="lg-tick">'+I.check+'</span><span class="t"><b>'+esc(g.text)+'</b><span>'+esc("Completed "+new Date(g.doneAt).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}))+'</span></span>'+I.chev+'</button>').join("")+'</div>':'');
}

let editL=null; // working copy {id, kind, text, pct, target, prog, due, done, since}

function renderLong(){

  let html=sheetHead(streak&&L.id?"Streak":L.id?"Long-term goal":"New long-term goal");
  if(streak&&g){

    html+='<div class="sk-hero"><span class="sk-art">'+cairn(stonesFor(d),stonesFor(Math.max(g.best,d)),132)+'</span><div><span class="sk-count"><b>'+big[0]+'</b>'+big[1]+'</span>'+

      '<div class="stats" style="margin-bottom:22px"><div class="stat"><b>'+Math.max(g.best,d)+'</b><span>Best run, in days</span></div><div class="stat"><b>'+g.slips.length+'</b><span>'+(g.slips.length===1?"Slip":"Slips")+'</span></div></div>';
  }

    (streak&&L.id?'':measure)+
    (streak

      (!L.id?'':streak?'<button class="btn block-btn" data-slip="'+esc(L.id)+'">I slipped</button>':'<button class="btn block-btn" data-l-done>'+(L.done?"Reopen goal":"Mark complete")+'</button>')+
      (L.id?'<button class="btn danger block-btn" data-l-delete>Delete goal</button>':'')+'</div>';
  if(sheetOpen[2]){const sh=$("#sheet2"),st=sh.scrollTop;sh.innerHTML='<div class="grab"></div>'+html;sh.scrollTop=st;}
  else openSheet(2,html);

}
function commitLong(){
  const L=editL;if(!L)return null;
  const text=L.text.trim(),target=draftMax(L);
  if(!text){toast("Give the goal a name first.");return null;}
  if(L.kind==="streak"){
    const since=KEY_RE.test(L.since)&&L.since<=TODAY?L.since:TODAY;
    let g=L.id&&S.longs.find(x=>x.id===L.id);
    const fresh=!g;
    if(fresh){g=cleanLong({text,kind:"streak"});S.longs.push(g);}
    g.text=text;g.updatedAt=Date.now();
    // Only move the start when the date was actually changed; today means "from this moment".
    if(fresh||since!==keyOf(new Date(g.start))){g.start=since===TODAY?Date.now():parseKey(since).getTime();g.seen=stonesFor(streakDays(g));}
    save();
    return g;
  }
  if(!target){toast("Set a target of 2 or more.");return null;}
  let g=L.id&&S.longs.find(x=>x.id===L.id);
  if(!g){g=cleanLong({text});S.longs.push(g);}
  g.text=text;g.pct=L.pct;g.target=target;g.due=KEY_RE.test(L.due)?L.due:"";
  setLongProg(g,L.prog);
  save();
  return g;
}

/* Drag a long-term goal's bar to set how far along it is */
let slide=null;
function slideTo(s,x){
  const r=s.el.getBoundingClientRect(),f=Math.max(0,Math.min(1,(x-r.left-11)/(r.width-22)));
  let v=Math.round(f*s.g.target);
  if(s.g.pct)v=Math.round(v/5)*5; // percent moves in fives; the box takes an exact figure
  s.val=v;showLong(s.el.closest(".lg"),s.g,v);
}
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const el=e.target.closest&&e.target.closest("[data-lslide]");if(!el)return;
  const g=S.longs.find(x=>x.id===el.dataset.lslide);if(!g)return;
  slide={el,g,id:e.pointerId,x:e.clientX,y:e.clientY,on:false,val:g.prog};
});
document.addEventListener("pointermove",e=>{
  const s=slide;if(!s||e.pointerId!==s.id)return;
  if(!s.on){
    const dx=e.clientX-s.x,dy=e.clientY-s.y;
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){slide=null;return;} // it's a scroll
    if(Math.abs(dx)<6)return;
    s.on=true;s.el.classList.add("drag");
    try{s.el.setPointerCapture(e.pointerId);}catch(err){}
  }
  slideTo(s,e.clientX);
});
function endSlide(e,cancelled){
  const s=slide;if(!s||e.pointerId!==s.id)return;
  slide=null;s.el.classList.remove("drag");
  const card=s.el.closest(".lg");
  if(cancelled){showLong(card,s.g,s.g.prog);return;}
  if(!s.on)slideTo(s,e.clientX); // a tap on the bar jumps to that spot
  applyLong(s.g,s.val,card);
}
document.addEventListener("pointerup",e=>endSlide(e,false));
document.addEventListener("pointercancel",e=>endSlide(e,true));
document.addEventListener("keydown",e=>{
  const el=e.target.closest&&e.target.closest("[data-lslide]"),d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];
  if(!el||!d)return;
  const g=S.longs.find(x=>x.id===el.dataset.lslide);if(!g)return;
  e.preventDefault();applyLong(g,g.prog+d*(g.pct?5:1),el.closest(".lg"));
});
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches("[data-lnum]"))e.target.select();});

  r.text=text;r.freq=R.freq;r.days=R.freq==="custom"?R.days.slice():[];r.time=R.remind?R.time:"";r.target=target;

/* =========================================================
   Calendar reminders (.ics)
   ========================================================= */
const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
function icsText(s){return String(s).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function stampUTC(){const d=new Date();return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";}
function firstDate(r,ctx){
  if(r.freq==="once"){
    if(ctx&&ctx>=TODAY&&!(ctx===TODAY&&nowHM()>=r.time))return ctx;
    return nowHM()<r.time?TODAY:tomorrowKey();
  }
  let k=TODAY;
  for(let i=0;i<8;i++){if(repeatsOn(r,k))return k;k=addDays(k,1);}
  return TODAY;
}
function rrule(r){
  if(r.freq==="daily")return "FREQ=DAILY";
  if(r.freq==="weekdays")return "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR";
  if(r.freq==="weekends")return "FREQ=WEEKLY;BYDAY=SA,SU";
  if(r.freq==="custom"&&r.days.length)return "FREQ=WEEKLY;BYDAY="+r.days.map(d=>BYDAY[d]).join(",");
  return "";
}
// Google Calendar's "new event" page, filled in from the link. No sign-in or key is needed inside Stoa.
function gcalUrl(r,ctx){
  const k=firstDate(r,ctx),hm=r.time.split(":").map(Number),end=parseKey(k);
  end.setHours(hm[0],hm[1]+15);
  const q=new URLSearchParams({
    action:"TEMPLATE",text:r.text,details:"Goal from Stoa",
    dates:k.replace(/-/g,"")+"T"+pad(hm[0])+pad(hm[1])+"00/"+keyOf(end).replace(/-/g,"")+"T"+pad(end.getHours())+pad(end.getMinutes())+"00"
  });
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(tz)q.set("ctz",tz);}catch(e){}
  const rule=rrule(r);if(rule)q.set("recur","RRULE:"+rule);
  return "https://calendar.google.com/calendar/render?"+q;
}
function openGcal(r,ctx){
  const u=gcalUrl(r,ctx);
  // From the home-screen app, a link to another site opens in a browser sheet on top of Stoa.
  if(isIOS&&standalone){window.location.href=u;return;}
  const w=window.open(u,"_blank");
  if(w){try{w.opener=null;}catch(e){}}else window.location.href=u;
}
function vevent(r,ctx){
  const k=firstDate(r,ctx),t=r.time.replace(":","");
  const L=["BEGIN:VEVENT","UID:"+r.id+"-"+Date.now()+"@stoa.app","DTSTAMP:"+stampUTC(),"DTSTART:"+k.replace(/-/g,"")+"T"+t+"00","DURATION:PT15M","SUMMARY:"+icsText(r.text),"DESCRIPTION:"+icsText("Goal from Stoa")];
  const rule=rrule(r);if(rule)L.push("RRULE:"+rule);
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(r.text),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  return L;
}
const buildIcs=events=>["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Stoa//Journal//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"].concat(...events,["END:VCALENDAR"]).join("\r\n");
function openIcs(events,name){
  const ics=buildIcs(events);
  if(isIOS&&standalone&&location.protocol==="https:"){
    // A home-screen app can't open calendar data itself, so hand it to Safari, which shows the "Add to Calendar" prompt.
    // The event travels after the # so it is never sent to a server.
    window.location.href="x-safari-"+new URL("cal.html",location.href).href+"#"+encodeURIComponent(ics);
    return;
  }
  if(isIOS){
    // Safari on iPhone opens calendar data with an "Add to Calendar" prompt.
    window.location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
    return;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download=name+".ics";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"goal";

/* =========================================================
   Backup
   ========================================================= */
async function exportData(){
  lockPause();
  // Photos go in the backup as data, so it is complete on its own.
  const photos={},ids=new Set();
  Object.values(S.days).forEach(d=>(d.photos||[]).forEach(id=>ids.add(id)));
  S.notes.forEach(x=>x.photos.forEach(id=>ids.add(id)));
  for(const id of ids){try{const ph=await photoGet(id);if(ph)photos[id]=await blobToDataUrl(ph.blob);}catch(e){}}
  const data=JSON.stringify({app:"stoa",version:2,exportedAt:new Date().toISOString(),profile:S.profile,settings:S.settings,days:S.days,routines:S.routines,quotes:S.quotes,notes:S.notes,longs:S.longs,photos},null,2);
  const name="stoa-backup-"+TODAY+".json";
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Stoa backup"});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("Backup saved");
}
function importData(file){
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const obj=JSON.parse(fr.result);
      if(!obj||typeof obj.days!=="object")throw 0;
      let n=0;
      for(const k in obj.days){
        if(!KEY_RE.test(k))continue;
        const inc=cleanDay(obj.days[k]),cur=S.days[k];
        if(!cur||inc.updatedAt>cur.updatedAt){S.days[k]=inc;n++;}
      }
      (obj.routines||[]).forEach(r=>{const c=cleanRoutine(r);if(c.text&&!routine(c.id)&&!S.routines.some(x=>x.text.toLowerCase()===c.text.toLowerCase()))S.routines.push(c);});
      (obj.quotes||[]).forEach(q=>{
        const c=cleanQuote(q);if(!c.text)return;
        const cur=S.quotes.find(x=>x.id===c.id||x.text===c.text);
        if(!cur)S.quotes.push(c);else if(c.note&&!cur.note)cur.note=c.note;
      });
      (obj.notes||[]).forEach(x=>{
        const c=cleanNote(x);if(!c.text.trim()&&!c.photos.length)return;
        const cur=S.notes.find(y=>y.id===c.id);
        if(!cur)S.notes.push(c);else if(c.updatedAt>cur.updatedAt){cur.text=c.text;cur.photos=c.photos;cur.updatedAt=c.updatedAt;}
      });
      for(const id in (obj.photos||{})){
        const data=obj.photos[id];
        if(typeof data!=="string"||!/^data:image\//.test(data))continue;
        try{if(!(await photoGet(id)))await photoPut({id,blob:await (await fetch(data)).blob(),at:Date.now()});}catch(e){}
      }
      (obj.longs||[]).forEach(x=>{
        const c=cleanLong(x);if(!c.text)return;
        const i=S.longs.findIndex(y=>y.id===c.id);
        if(i<0)S.longs.push(c);else if(c.updatedAt>S.longs[i].updatedAt)S.longs[i]=c;
      });
      if(obj.profile&&obj.profile.name&&!S.profile.name)S.profile.name=String(obj.profile.name).slice(0,40);
      // Older backups: give their goals a saved-goal entry
      for(const k in S.days)S.days[k].goals.forEach(g=>{if(!g.rid){const r=findOrCreateRoutine(g.text);r.lastUsed=0;g.rid=r.id;}});
      save();renderToday();renderAll();
      toast(n?"Imported "+n+" day"+(n===1?"":"s"):"Backup imported");
    }catch(e){toast("That file isn't a Stoa backup.");}
  };
  fr.readAsText(file);
}

/* =========================================================
   App lock
   A 4-digit passcode asked for when Stoa opens or comes back. Only a salted, slowed-down hash of
   it is kept (PBKDF2), on this phone. It keeps people out of the app; it doesn't encrypt the journal.
   ========================================================= */
const LOCK_KEY="stoa.lock.v1",FAIL_KEY="stoa.lock.fails";
const LOCK_AFTER=[[0,"Right away"],[60,"After 1 minute"],[300,"After 5 minutes"]];
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),fromB64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
function lockConf(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||"null");}catch(e){return null;}}
function lockFails(){try{return JSON.parse(localStorage.getItem(FAIL_KEY)||"null")||{n:0,until:0};}catch(e){return {n:0,until:0};}}
async function pinHash(pin,salt,iter){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
  return toB64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},key,256));
}
let lockMode=null,pin="",firstPin="",hiddenAt=0,lockGrace=0,lockT=null;
// Opening the camera, a calendar or the share sheet briefly leaves Stoa; that shouldn't ask for the passcode.
function lockPause(){lockGrace=Date.now()+120000;}
function setInert(on){["main",".nav","#sheet1","#sheet2","#composer","#viewer"].forEach(sel=>{const el=$(sel);if(el)el.inert=on;});}
const LOCK_TITLES={unlock:"Enter your passcode",set1:"Choose a 4-digit passcode",set2:"Enter it again",off:"Enter your passcode to turn the lock off",change:"Enter your current passcode"};
function showLock(mode){
  lockMode=mode;pin="";if(mode!=="set2")firstPin="";
  const el=$("#lock"),c=lockConf(),bio=mode==="unlock"&&!!(c&&c.bio);
  el.innerHTML='<div class="lock-in"><img class="lock-logo" src="apple-touch-icon.png" alt=""><p class="lock-title">'+LOCK_TITLES[mode]+'</p>'+
    '<div class="lock-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="lock-msg" aria-live="polite"></p>'+
    '<div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(d=>'<button data-kp="'+d+'">'+d+'</button>').join("")+
    (mode!=="unlock"?'<button class="kp-text" data-kp-cancel>Cancel</button>':bio?'<button class="kp-text kp-bio" data-kp-bio aria-label="Unlock with Face ID">'+I.faceid+'</button>':'<button class="kp-text" data-kp-forgot>Forgot?</button>')+
    '<button data-kp="0">0</button><button class="kp-text" data-kp-del aria-label="Delete">Delete</button></div>'+
    (bio?'<button class="link lock-forgot" data-kp-forgot>Forgot passcode?</button>':'')+'</div>';
  el.hidden=false;el.classList.remove("out");setInert(true);
  if(mode==="unlock"||mode==="off"||mode==="change")lockoutTick();
  if(bio)setTimeout(bioUnlock,300); // offer Face ID straight away; the keypad stays as the fallback
}
function hideLock(){
  const el=$("#lock");lockMode=null;pin="";setInert(false);el.classList.add("out");
  setTimeout(()=>{if(!lockMode){el.hidden=true;el.innerHTML="";el.classList.remove("out");}},320);
}
const drawDots=()=>$$("#lock .lock-dots i").forEach((d,i)=>d.classList.toggle("on",i<pin.length));
function lockMsg(text,shake){
  const m=$("#lock .lock-msg");if(m)m.textContent=text;
  if(shake){const d=$("#lock .lock-dots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");}}
}
// After 5 wrong tries the keypad rests for 30 seconds, doubling each time after that (up to 5 minutes).
function lockoutTick(){
  clearTimeout(lockT);
  const left=Math.ceil((lockFails().until-Date.now())/1000);
  $$("#lock [data-kp]").forEach(b=>b.disabled=left>0);
  if(left>0){lockMsg("Too many tries. Try again in "+left+" second"+(left===1?"":"s")+".");lockT=setTimeout(lockoutTick,1000);}
  else{const m=$("#lock .lock-msg");if(m&&m.textContent.startsWith("Too many"))m.textContent="";}
}
function lockFailed(){
  const f=lockFails();f.n++;
  if(f.n>=5)f.until=Date.now()+Math.min(300,30*2**(f.n-5))*1000;
  localStorage.setItem(FAIL_KEY,JSON.stringify(f));
  lockMsg("Wrong passcode",true);lockoutTick();
}
function kpDigit(d){
  if(!lockMode||pin.length>=4||$("#lock [data-kp]:disabled"))return;
  pin+=d;drawDots();
  if(pin.length===4)setTimeout(pinDone,120);
}
function kpDel(){pin=pin.slice(0,-1);drawDots();}
async function pinDone(){
  const entered=pin,mode=lockMode;pin="";
  if(mode==="set1"){firstPin=entered;showLock("set2");return;}
  if(mode==="set2"){
    if(entered!==firstPin){showLock("set1");lockMsg("Those didn't match. Try again.",true);return;}
    const salt=crypto.getRandomValues(new Uint8Array(16)),iter=150000,old=lockConf();
    localStorage.setItem(LOCK_KEY,JSON.stringify({salt:toB64(salt),iter,hash:await pinHash(entered,salt,iter),after:old?old.after:0,bio:old?old.bio:undefined}));
    firstPin="";hideLock();toast("Passcode set. Stoa will ask for it when you come back.");lockRefresh();return;
  }
  const c=lockConf();
  if(!c){hideLock();return;}
  if(await pinHash(entered,fromB64(c.salt),c.iter)!==c.hash){drawDots();lockFailed();return;}
  localStorage.removeItem(FAIL_KEY);
  if(mode==="unlock")hideLock();
  else if(mode==="off"){localStorage.removeItem(LOCK_KEY);hideLock();toast("Passcode turned off.");lockRefresh();}
  else if(mode==="change")showLock("set1");
}

    (bioOk?'<label class="switch-row" style="margin-top:12px"><span>Unlock with Face ID</span><span class="switch"><input type="checkbox" data-bio'+(c.bio?" checked":"")+' aria-label="Unlock with Face ID"><i></i></span></label>':'')+

    '<div class="btn-row"><button class="btn" data-lock-change>Change passcode</button><button class="btn" data-lock-off>Turn off</button></div>';

/* Face ID: a passkey on this phone that only opens after Face ID (or Touch ID) checks it's you.
   Stoa only learns yes or no; the face never reaches the app. */
let bioOk=false,bioBusy=false;
if(window.PublicKeyCredential&&window.isSecureContext&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(v=>{bioOk=!!v;lockRefresh();}).catch(()=>{});
const toB64url=buf=>toB64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function bioEnable(){
  const c=lockConf();if(!c)return false;
  try{
    const cred=await navigator.credentials.create({publicKey:{
      rp:{name:"Stoa",id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"Stoa app lock",displayName:"Stoa app lock"},
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},
      timeout:60000,attestation:"none"
    }});
    if(!cred)return false;
    c.bio=toB64(cred.rawId);localStorage.setItem(LOCK_KEY,JSON.stringify(c));
    return true;
  }catch(e){return false;}
}
async function bioUnlock(){
  const c=lockConf();
  if(!c||!c.bio||lockMode!=="unlock"||bioBusy)return;
  bioBusy=true;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const a=await navigator.credentials.get({publicKey:{challenge,rpId:location.hostname,allowCredentials:[{type:"public-key",id:fromB64(c.bio)}],userVerification:"required",timeout:60000}});
    const data=JSON.parse(new TextDecoder().decode(a.response.clientDataJSON));
    const verified=(new Uint8Array(a.response.authenticatorData)[32]&4)!==0; // "user verified" flag: Face ID really ran
    if(toB64(a.rawId)===c.bio&&data.type==="webauthn.get"&&data.challenge===toB64url(challenge)&&verified&&lockMode==="unlock"){
      localStorage.removeItem(FAIL_KEY);hideLock();
    }
  }catch(e){} // cancelled, or not possible right now: the keypad is still there
  bioBusy=false;
}
document.addEventListener("visibilitychange",()=>{
  const c=lockConf();if(!c||lockMode)return;
  if(document.visibilityState==="hidden"){
    hiddenAt=Date.now();

    if(!c.after&&Date.now()>lockGrace)showLock("unlock");
  }else if(hiddenAt){
    // Back again: ask if Stoa was away longer than the chosen time.
    if(Date.now()>lockGrace&&Date.now()-hiddenAt>=c.after*1000)showLock("unlock");
    hiddenAt=0;lockGrace=0;
  }
});

/* =========================================================
   Photos
   Pictures live in the phone's own database (IndexedDB), not with the rest of the journal,
   because they are much bigger. A day or a note keeps only their ids.
   ========================================================= */
let photoDb=null;
function openPhotoDb(){
  return photoDb||(photoDb=new Promise((ok,fail)=>{
    const q=indexedDB.open("stoa-photos",2);
    q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("photos"))q.result.createObjectStore("photos",{keyPath:"id"});};
    q.onsuccess=()=>ok(q.result);q.onerror=()=>fail(q.error);
  }));
}
async function photoStore(mode,fn){
  const db=await openPhotoDb();
  return new Promise((ok,fail)=>{
    const tx=db.transaction("photos",mode),req=fn(tx.objectStore("photos"));
    tx.oncomplete=()=>ok(req&&req.result);tx.onerror=()=>fail(tx.error);
  });
}
const photoPut=ph=>photoStore("readwrite",st=>st.put(ph));
const photoGet=id=>photoStore("readonly",st=>st.get(id));
const photoUrls=new Map();
async function photoUrl(id){
  if(!photoUrls.has(id)){const ph=await photoGet(id).catch(()=>null);if(!ph)return "";photoUrls.set(id,URL.createObjectURL(ph.blob));}
  return photoUrls.get(id);
}
function forgetPhoto(id){
  photoStore("readwrite",st=>st.delete(id)).catch(()=>{});
  const u=photoUrls.get(id);if(u){URL.revokeObjectURL(u);photoUrls.delete(id);}
}
const photoCount=ids=>{const c=(ids||[]).length;return c+(c===1?" photo":" photos");};
const blobToDataUrl=b=>new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>fail(r.error);r.readAsDataURL(b);});
function photosHTML(ids,owner){
  return ids.length?'<div class="ph-strip">'+ids.map(id=>'<button class="ph-thumb" data-ph-open="'+esc(id)+'" data-ph-owner="'+esc(owner)+'" aria-label="Open photo"><img data-ph-src="'+esc(id)+'" alt=""></button>').join("")+'</div>':"";
}
function fillPhotos(root){$$("img[data-ph-src]",root).forEach(async img=>{if(!img.src)img.src=await photoUrl(img.dataset.phSrc);});}
function notePhotos(){

// Scale a picture down (it also comes out the right way up) and re-encode it as JPEG.
async function shrinkPhoto(file,max,quality){
  const url=URL.createObjectURL(file);
  try{
    // Waits for "load" rather than decode(), which can stall while the app is in the background.
    const img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    return {canvas:c,w,h,blob:await new Promise(ok=>c.toBlob(ok,"image/jpeg",quality))};
  }finally{URL.revokeObjectURL(url);}
}

/* =========================================================
   Notifications
   A small server sends a push when a reminder is due. It is given this phone's push address and
   the reminder times, nothing else: the goal names stay here, and the service worker looks them
   up when the push arrives.
   ========================================================= */
const PUSH_URL="https://stoa-push.stoa-push.workers.dev";
const PUSH_KEY="BCh9gmwHAXRG2uAqKhOcq4qL63MwMIcDOSzY-AiJRBfva9K_Nu8PY2TfNDAGgSZJZPury4u8xXmZsgVj5MwEOQw";
const PUSH_SENT="stoa.push.sent"; // the last thing the server was told, so it is only told again on a change
// iPhone only offers this to an app opened from the home screen (iOS 16.4 or later).
const pushCapable=location.protocol==="https:"&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
let pushOn=false,pushT=null,pushNames="";
const pushSub=async()=>pushCapable?(await navigator.serviceWorker.ready).pushManager.getSubscription():null;
const pushPost=(path,data)=>fetch(PUSH_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:typeof data==="string"?data:JSON.stringify(data)});
// When each reminder should fire. A repeating goal already ticked off today is skipped for today.
function reminderTimes(){
  const out=[],today=getDay(TODAY);
  S.routines.forEach(r=>{
    if(!r.time)return;
    if(r.freq==="once"){
      for(const k in S.days)if(k>=TODAY&&S.days[k].goals.some(g=>g.rid===r.id&&!g.done))out.push({id:r.id,time:r.time,freq:"once",date:k});
      return;
    }
    const o={id:r.id,time:r.time,freq:r.freq},g=today.goals.find(x=>x.rid===r.id);
    if(r.freq==="custom")o.days=r.days;
    if(g&&g.done)o.skip=TODAY;
    out.push(o);
  });
  return out;
}
async function pushSync(force){
  try{
    const sub=await pushSub();
    pushOn=!!sub&&Notification.permission==="granted";
    if(!pushOn)return false;
    // Goal names for the service worker to read; they never leave the phone.
    const names={};S.routines.forEach(r=>{if(r.time)names[r.id]=r.text;});
    const json=JSON.stringify(names);
    if(json!==pushNames){
      await (await caches.open("stoa-notify")).put("./reminders.json",new Response(json,{headers:{"Content-Type":"application/json"}}));
      pushNames=json;
    }
    const body=JSON.stringify({sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC",reminders:reminderTimes()});
    if(!force&&localStorage.getItem(PUSH_SENT)===body)return true;
    if(!(await pushPost("/sync",body)).ok)return false;
    localStorage.setItem(PUSH_SENT,body);
    return true;
  }catch(e){return false;}
}
function pushSoon(){if(!pushOn)return;clearTimeout(pushT);pushT=setTimeout(pushSync,1500);}
// Redraw whichever sheet is showing the notification controls.
function pushRefresh(){
  if(editR&&sheetOpen[2])renderRoutine();
  else{const box=$("[data-push-box]");if(box)box.innerHTML=pushBox();}
}
function pushBox(){
  if(!pushCapable)return '<p class="hint" style="margin:0">To get reminders as notifications, open Stoa from its home-screen icon (an iPhone needs iOS 16.4 or later), then come back here.</p>';
  if(pushOn)return '<p class="hint" style="margin:0 0 12px">On for this phone. A goal with a reminder time notifies you then, even when Stoa is closed.</p>'+
    '<div class="btn-row"><button class="btn" data-push-test>Send a test</button><button class="btn" data-push-off>Turn off</button></div>';
  return '<button class="btn block-btn" data-push-on>'+I.bell+'Turn on notifications</button>'+
    '<p class="hint">Your phone will ask for permission. Only the reminder times go to the notification server, never what your goals say.</p>';
}
async function pushEnable(){
  if(!pushCapable){toast("Open Stoa from its home-screen icon to turn on notifications.");return;}
  try{
    if(await Notification.requestPermission()!=="granted"){toast("Notifications are blocked. Allow them for Stoa in your phone's Settings.");return;}
    const reg=await navigator.serviceWorker.ready;
    if(!(await reg.pushManager.getSubscription())){
      const raw=atob(PUSH_KEY.replace(/-/g,"+").replace(/_/g,"/"));
      await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(raw,c=>c.charCodeAt(0))});
    }
    toast(await pushSync(true)?"Notifications are on.":"Couldn't reach the notification server. Try again when you're online.");
  }catch(e){toast("Couldn't turn notifications on.");}
  pushRefresh();
}
async function pushDisable(){
  try{
    const sub=await pushSub();
    if(sub){pushPost("/unsub",{endpoint:sub.endpoint}).catch(()=>{});await sub.unsubscribe();}
  }catch(e){}
  pushOn=false;localStorage.removeItem(PUSH_SENT);
  toast("Notifications are off.");pushRefresh();
}
async function pushTest(){
  try{
    const sub=await pushSub();
    if(!sub||!(await pushSync(true))){toast("Couldn't reach the notification server.");return;}
    const r=await (await pushPost("/test",{endpoint:sub.endpoint})).json();
    let why="";try{why=JSON.parse(r.detail).reason||"";}catch(e){}
    toast(r.ok?"Test sent. It should arrive in a few seconds.":"The test didn't go through ("+[r.status||"no answer",why].filter(Boolean).join(", ")+").");
  }catch(e){toast("Couldn't send the test.");}
}

const FX_COLORS=["var(--accent)","var(--ink)","var(--m4)","var(--muted)"];
function fxLayer(){let l=$("#fx");if(!l){l=document.createElement("div");l.id="fx";l.setAttribute("aria-hidden","true");document.body.appendChild(l);}return l;}
function fxPiece(css,frames,opts,life){
  const el=document.createElement("i");el.style.cssText=css;fxLayer().appendChild(el);
  const a=el.animate(frames,opts),done=()=>el.remove();
  a.onfinish=done;setTimeout(done,life); // the timer covers a backgrounded app, where animations pause

// A small pop of dots out of one point.
function burst(x,y,count){
  if(reduceMotion.matches||!document.body.animate)return;
  for(let i=0;i<count;i++){
    const ang=Math.PI*2*i/count+Math.random()*.6,dist=34+Math.random()*38,size=5+Math.random()*5;
    fxPiece("left:"+x+"px;top:"+y+"px;width:"+size+"px;height:"+size+"px;background:"+FX_COLORS[i%3]+(i%2?";border-radius:50%":""),
      [{transform:"translate(-50%,-50%)",opacity:1},{transform:"translate(calc(-50% + "+Math.cos(ang)*dist+"px),calc(-50% + "+(Math.sin(ang)*dist+16)+"px)) scale(.5) rotate("+(Math.random()*240-120)+"deg)",opacity:0}],
      {duration:620+Math.random()*280,easing:"cubic-bezier(.15,.7,.3,1)"},1300);
  }
}
// Pieces falling down the whole screen, for the bigger wins.
function confetti(){
  if(reduceMotion.matches||!document.body.animate)return;
  const w=innerWidth,h=innerHeight;
  for(let i=0;i<48;i++){
    const size=5+Math.random()*5;
    fxPiece("left:"+Math.random()*w+"px;top:-14px;width:"+size+"px;height:"+size*(i%3?1:1.8)+"px;background:"+FX_COLORS[i%4]+(i%4?"":";border-radius:50%"),
      [{transform:"translate(0,0)",opacity:1},{transform:"translate("+(Math.random()-.5)*140+"px,"+h*(.55+Math.random()*.4)+"px) rotate("+(Math.random()*720-360)+"deg)",opacity:0}],
      {duration:1300+Math.random()*900,delay:Math.random()*260,easing:"cubic-bezier(.2,.6,.4,1)",fill:"backwards"},3000);
  }
  if(navigator.vibrate)try{navigator.vibrate([14,40,22]);}catch(e){}
}
function goalFx(li){
  if(!li)return;
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  if(reduceMotion.matches)return;
  li.classList.remove("flash");void li.offsetWidth;li.classList.add("flash");
  // Measured from the row, not the tick: after a swipe the tick is still sliding back into place.
