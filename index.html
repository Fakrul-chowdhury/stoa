<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stoa</title>
<meta name="description" content="Daily journal, mood, energy and goals.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stoa">
<meta name="theme-color" content="#F5F5F5" id="theme-color">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#121212; --muted:#5F6B78; --line:#E2E4E8; --line-strong:#C3C9D0;
  --accent:#F05454; --accent-soft:#FDE6E6; --navy:#30475E; --on-navy:#F5F5F5; --energy:#30475E;
  --feature:#30475E; --on-feature:#F5F5F5;
  --scrim:rgba(18,18,18,.45);
  --m1:#30475E; --m2:#5E7389; --m3:#A9B2BC; --m4:#F59C91; --m5:#F05454;
  --f1:#F5F5F5; --f2:#F5F5F5; --f3:#121212; --f4:#121212; --f5:#121212;
  --serif:ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --ease-sheet:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --ink:#F5F5F5; --muted:#A1A1A1; --line:#272727; --line-strong:#444444;
    --accent-soft:#3A1F1F; --navy:#F5F5F5; --on-navy:#121212; --energy:#8C8C8C; --scrim:rgba(0,0,0,.62);
    --feature:#232323; --on-feature:#F5F5F5;
    --m1:#606060; --m2:#888888; --m3:#B4B4B4; --f2:#121212;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --ink:#F5F5F5; --muted:#A1A1A1; --line:#272727; --line-strong:#444444;
  --accent-soft:#3A1F1F; --navy:#F5F5F5; --on-navy:#121212; --energy:#8C8C8C; --scrim:rgba(0,0,0,.62);
  --feature:#232323; --on-feature:#F5F5F5;
  --m1:#606060; --m2:#888888; --m3:#B4B4B4; --f2:#121212;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,.btn{transition:transform .2s var(--ease),opacity .2s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease)}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:inherit}
.muted{color:var(--muted)}
.small{font-size:14px}

main{max-width:560px;margin:0 auto;padding:18px 20px 120px}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 22px}
.greet{margin:0 0 2px;color:var(--muted);font-size:15px}
.date{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.streak{display:flex;align-items:center;gap:5px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.streak svg{width:18px;height:18px;fill:var(--line-strong);transition:fill .4s var(--ease)}
.streak:active{transform:scale(.96)}
.streak.lit svg{fill:var(--accent)}
.streak b{font-size:17px;font-variant-numeric:tabular-nums}
.streak span{font-size:13px;color:var(--muted)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex-shrink:0}
.icon-btn:active{background:var(--line);transform:scale(.9)}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Quote strip on Today */
.qstrip{display:block;width:100%;text-align:left;margin:0 0 26px;padding:2px 0 2px 14px;border-left:3px solid var(--accent)}
.qstrip q{display:block;font-family:var(--serif);font-size:17px;line-height:1.45;quotes:none}
.qstrip span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.qstrip:active{opacity:.6}

/* Mood */
.mood-top{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.face-big{flex-shrink:0;line-height:0}
.face-big.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.86)}100%{transform:scale(1)}}
.mood-q{font-family:var(--serif);font-size:22px;line-height:1.25;font-weight:600}
.mood-now{margin:4px 0 0;color:var(--muted);font-size:15px}
.mood-now b{color:var(--ink);font-weight:600}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:14px}
.mood-btn .f{line-height:0;border-radius:50%;padding:3px;box-shadow:0 0 0 2px transparent;transition:box-shadow .3s var(--ease),transform .3s var(--spring)}
.mood-btn span:last-child,.en-btn span:last-child{font-size:13px;color:var(--muted);transition:color .25s var(--ease)}
.mood-btn[aria-checked="true"] .f{box-shadow:0 0 0 2px var(--ink)}
.mood-btn[aria-checked="true"] span:last-child,.en-btn[aria-checked="true"] span:last-child{color:var(--ink);font-weight:600}
.mood-btn:active .f{transform:scale(.92)}

/* Energy */
.en-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 8px;border-radius:14px;border:1px solid transparent}
.en-btn:active{transform:scale(.95)}
.en-btn svg{width:30px;height:24px;display:block}
.en-btn rect{fill:var(--line);transition:fill .3s var(--ease)}
.en-btn rect.on{fill:var(--muted)}
.en-btn[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.en-btn[aria-checked="true"] rect.on{fill:var(--accent)}

/* Sections */
.block{margin-top:32px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:17px;font-weight:650}
.save-state{font-size:13px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:14px}

/* Journal page */
.page{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 8px;transition:border-color .25s var(--ease)}
.page:focus-within{border-color:var(--line-strong)}
.prompt-row{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.prompt{margin:0;flex:1;font-family:var(--serif);font-size:18px;line-height:1.45}
textarea.entry-input{display:block;width:100%;min-height:170px;border:0;background:transparent;resize:none;outline:none;font-family:var(--serif);font-size:18px;line-height:1.7;padding:6px 0 12px}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.7}

/* Goals */
.goal-list{list-style:none;margin:0;padding:0}
.goal{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:first-child{border-top:1px solid var(--line)}
.check{width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0}
.check:active{transform:scale(.86)}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .2s var(--ease),transform .4s var(--spring)}
.goal.done .check{background:var(--accent);border-color:var(--accent)}
.goal.done .check svg{opacity:1;transform:scale(1)}
.goal-main{flex:1;min-width:0;text-align:left;padding-top:1px}
.goal-text{display:block;overflow-wrap:anywhere;transition:color .3s var(--ease)}
.goal.done .goal-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.goal-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;font-size:13px;color:var(--muted)}
.goal-meta span{display:inline-flex;align-items:center;gap:4px}
.goal-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.goal-meta .due{color:var(--accent);font-weight:600}
.del{width:30px;height:30px;display:grid;place-items:center;color:var(--line-strong);border-radius:50%;flex-shrink:0}
.del svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.del:active{color:var(--ink);background:var(--line);transform:scale(.9)}
.goal-empty{margin:0;padding:12px 0;color:var(--muted);font-size:15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.goal-add{display:flex;gap:8px;margin-top:12px}
.goal-add input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .25s var(--ease)}
.goal-add input:focus{border-color:var(--navy)}
.btn-add{padding:0 16px;border-radius:12px;background:var(--navy);color:var(--on-navy);font-weight:600;font-size:15px}
.btn-add:active,.chip:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;background:var(--surface)}
.chip b{color:var(--accent);font-weight:700;margin-right:3px}
.chip.ghost{border-style:dashed;color:var(--muted);background:none}
.move{margin-top:12px}

/* Progress bars */
.goal{flex-wrap:wrap}
.goal-prog{flex-basis:100%;display:flex;align-items:center;gap:10px;padding:8px 0 0 36px}
.bar{flex:1;min-width:0;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .45s var(--ease)}
.prog-n{min-width:40px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-size:18px;line-height:1}
.step:active{transform:scale(.88)}
.num-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.num-row span{font-size:15px}
.num-row .input{width:120px;text-align:center}
input[type=range]{display:block;width:100%;margin:4px 0 0;accent-color:var(--accent)}

/* Long-term goals */
.lg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.lg-main{display:block;width:100%;text-align:left}
.lg-main:active{opacity:.55}
.lg-title{display:block;font-family:var(--serif);font-size:19px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.lg-meta{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.lg-meta.due{color:var(--accent)}
.lg-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.lg-slide{position:relative;flex:1;min-width:0;height:40px;padding:0 11px;display:flex;align-items:center;touch-action:pan-y;cursor:grab;border-radius:12px;-webkit-user-select:none;user-select:none}
.lg-slide .bar{height:10px}
.lg-slide .bar i{width:calc(var(--p,0)*100%)}
.lg-knob{position:absolute;top:50%;left:calc(11px + (100% - 22px)*var(--p,0));width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:left .45s var(--ease),transform .2s var(--ease)}
.lg-slide.drag{cursor:grabbing}
.lg-slide.drag .bar i,.lg-slide.drag .lg-knob{transition:none}
.lg-slide.drag .lg-knob{transform:scale(1.18)}
.lg-num{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;color:var(--muted);white-space:nowrap}
.lg-num input{width:60px;padding:8px 4px;text-align:center;font-size:16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);outline:none;-moz-appearance:textfield;appearance:textfield;transition:border-color .25s var(--ease)}
.lg-num input::-webkit-outer-spin-button,.lg-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lg-num input:focus{border-color:var(--navy)}
.lg-tick{width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:var(--accent)}
.saved-row .lg-tick svg{width:14px;height:14px;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.peb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.peb i{display:block;width:34px;height:26px;border-radius:50%;border:2px dashed var(--line-strong);transition:background-color .4s var(--ease),transform .2s var(--ease)}
.peb:active i{transform:scale(.9)}
.peb.on i{border:0}
.peb span{font-size:12px;color:var(--muted)}
.peb.today span{color:var(--ink);font-weight:700}

/* Page headers */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 20px}
.page-head h1{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.15}
.page-head p{margin:4px 0 0}
.search{width:100%;font-size:16px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .25s var(--ease)}
.search:focus{border-color:var(--navy)}

/* Journal list */
.month{font-family:var(--serif);font-size:20px;font-weight:600;margin:26px 0 4px}
.entry{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:active,.saved-row:active,.qbody:active{opacity:.55}
.entry .f{line-height:0;flex-shrink:0;padding-top:2px}
.entry-body{flex:1;min-width:0;display:block}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry-date{font-weight:600}
.entry-meta{font-size:13px;color:var(--muted);white-space:nowrap}
.entry-text{display:-webkit-box;margin-top:3px;font-family:var(--serif);color:var(--muted);font-size:16px;line-height:1.5;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:44px 12px;color:var(--muted)}
.empty p{margin:0 0 16px}
.empty .btn-row{justify-content:center}
.note-ic{width:40px;height:40px;margin-top:2px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.note-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line-strong);font-weight:600;font-size:15px;background:var(--surface);cursor:pointer;text-align:center}
.btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.danger{color:var(--accent);border-color:transparent;background:none}
.btn.muted-btn{color:var(--muted);border-color:transparent;background:none}
.btn.block-btn{width:100%}
a.btn{color:inherit;text-decoration:none}
.btn:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* Quotes */
.featured{position:relative;background:var(--feature);color:var(--on-feature);border-radius:24px;padding:28px 22px 20px;margin-bottom:26px;overflow:hidden}
.featured .mark{position:absolute;top:-6px;left:16px;font-family:var(--serif);font-size:96px;line-height:1;color:var(--accent)}
.featured q{position:relative;display:block;margin-top:22px;font-family:var(--serif);font-size:24px;line-height:1.35;quotes:none;font-weight:500}
.featured .by{margin-top:14px;font-size:14px;opacity:.75}
.featured .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.featured .lbl{font-size:13px;opacity:.6}
.featured .icon-btn{color:var(--on-feature);margin-right:-8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:500;background:var(--surface)}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:active,.dow button:active{transform:scale(.95)}
.qlist{margin-top:14px}
.qcard{display:flex;gap:10px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.qcard:first-child{border-top:1px solid var(--line)}
.qmain{flex:1;min-width:0}
.qbody{display:block;width:100%;text-align:left}
.qnote{padding:12px 0 2px}
.qnote-label{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qnote-text{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.qbody q{display:block;font-family:var(--serif);font-size:18px;line-height:1.45;quotes:none;overflow-wrap:anywhere}
.qbody span{display:block;margin-top:5px;font-size:14px;color:var(--muted)}
.heart svg{fill:none;stroke:currentColor}
.heart.pop svg{animation:pop .45s var(--spring)}
.heart[aria-pressed="true"]{color:var(--accent)}
.heart[aria-pressed="true"] svg{fill:var(--accent)}

/* Insights */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.stat{padding:14px 0 16px;border-top:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-size:40px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.chart svg{display:block;width:100%;height:auto}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.axis.pl{padding-left:30px}
.mix{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line);margin:4px 0 14px}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{font-family:var(--serif);font-weight:600;font-size:19px}
.cal-nav{display:flex;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;background:var(--bg)}
.cell.has{font-weight:600}
.cell.checked{background:var(--line)}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.future{opacity:.4;cursor:default}
.cell.pad{background:none}
button.cell:active{transform:scale(.9)}
.cal.fade{animation:fade-in .35s var(--ease)}
@keyframes fade-in{from{opacity:0}}

/* Nav */

<script>

/* =========================================================

   ========================================================= */
const $=(s,r)=>(r||document).querySelector(s);

let TODAY=keyOf(new Date());

/* =========================================================
   Data (stored only on this device)
   ========================================================= */
const blankDay=()=>({mood:0,energy:0,text:"",prompt:-1,goals:[],seeded:[],gone:0,updatedAt:0});
// A goal with a target is finished in steps: prog counts up to target, and it is done when they meet.
const cleanTarget=t=>{t=Math.round(Number(t)||0);return t>=2?Math.min(t,9999):0;};

function cleanGoal(g){
  const o={id:String(g.id||newId()),text:g.text.slice(0,300),done:!!g.done,rid:g.rid?String(g.rid):undefined};

  if(o.doneAt)o.prog=target;else if(o.prog>=target)o.doneAt=o.updatedAt;

function cleanNote(n){const c=Number(n.createdAt)||Date.now();return {id:String(n.id||newId()),text:String(n.text||""),createdAt:c,updatedAt:Number(n.updatedAt)||c};}
function cleanQuote(q){return {id:String(q.id||newId()),text:String(q.text||"").slice(0,2000),author:String(q.author||"").slice(0,120),note:String(q.note||"").slice(0,4000),fav:!!q.fav,createdAt:Number(q.createdAt)||Date.now()};}

  try{raw=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{};}catch(e){}

  for(const k in (raw.days||{}))if(KEY_RE.test(k))days[k]=cleanDay(raw.days[k]);

    profile:{name:raw.profile&&typeof raw.profile.name==="string"?raw.profile.name:"",onboarded:!!(raw.profile&&raw.profile.onboarded)},

const getDay=k=>S.days[k]||blankDay();

const checkedIn=d=>!!d&&(d.mood>0||d.energy>0||(d.text||"").trim().length>0);
const hasContent=d=>!!d&&(checkedIn(d)||d.goals.length>0);
const promptIdx=k=>{const d=getDay(k);return d.prompt>=0?d.prompt:hash(k)%PROMPTS.length;};

function streaks(){
  let cur=0,k=TODAY;
  const todayDone=checkedIn(S.days[TODAY]);
  if(!todayDone)k=addDays(k,-1);
  while(checkedIn(S.days[k])){cur++;k=addDays(k,-1);}
  const ks=Object.keys(S.days).filter(x=>x<=TODAY&&checkedIn(S.days[x])).sort();
  let best=0,run=0,prev=null;
  for(const x of ks){run=(prev&&addDays(prev,1)===x)?run+1:1;if(run>best)best=run;prev=x;}
  return {cur,best,total:ks.length,todayDone};
}

/* Recurring goals --------------------------------------- */
function repeatsOn(r,k){
  const d=parseKey(k).getDay();
  switch(r.freq){
    case "daily":return true;
    case "weekdays":return d>=1&&d<=5;
    case "weekends":return d===0||d===6;
    case "custom":return r.days.includes(d);
    default:return false;
  }
}
function seedDay(k){
  if(k<TODAY)return false;
  let changed=false;
  for(const r of S.routines){
    if(r.freq==="once"||!repeatsOn(r,k))continue;
    const d=getDay(k);
    if(d.seeded.includes(r.id)||d.goals.some(g=>g.rid===r.id))continue;
    const day=ensureDay(k);
    day.goals.push(newGoal(r));
    day.seeded.push(r.id);
    changed=true;
  }
  return changed;
}
function seedUpcoming(){const a=seedDay(TODAY),b=seedDay(tomorrowKey());if(a||b)save();}
function freqLabel(r){
  if(!r)return "";
  if(r.freq==="custom"){
    const ds=WEEK_ORDER.filter(d=>r.days.includes(d));
    return ds.length?ds.map(d=>dowName(d,"short")).join(", "):"";
  }
  const f=FREQS.find(x=>x[0]===r.freq);
  return r.freq==="once"?"":f[1];
}
function findOrCreateRoutine(text){
  const t=text.trim();
  let r=S.routines.find(x=>x.text.toLowerCase()===t.toLowerCase());
  if(!r){r=cleanRoutine({text:t,freq:"once"});S.routines.push(r);}
  r.lastUsed=Date.now();
  return r;
}

/* =========================================================
   Mutations
   ========================================================= */
function mutate(k,fn,slow){
  const before=streaks();
  const d=ensureDay(k);
  fn(d);
  d.updatedAt=Date.now();
  if(slow)saveSoon();else save();
  renderAll(slow);
  const after=streaks();
  if(!before.todayDone&&after.todayDone){
    toast(after.cur===1?"Checked in. Your streak starts today.":"Checked in. "+after.cur+"-day streak.");
  }
}
function addGoalText(k,text){
  const t=text.trim();if(!t)return false;
  const r=findOrCreateRoutine(t);
  if(getDay(k).goals.some(g=>g.rid===r.id&&!g.done)){toast("That goal is already on the list.");return false;}
  mutate(k,d=>{d.goals.push(newGoal(r));});
  return true;
}
// Carry unfinished goals from today into tomorrow, keeping any progress made.
function moveToTomorrow(ids){
  const tm=tomorrowKey(),left=getDay(TODAY).goals.filter(g=>!g.done&&(!ids||ids.includes(g.id)));
  if(!left.length)return 0;
  mutate(tm,d=>{left.forEach(g=>{
    const ex=d.goals.find(x=>!x.done&&(x.rid&&x.rid===g.rid||x.text.toLowerCase()===g.text.toLowerCase()));
    if(!ex)d.goals.push(Object.assign({id:newId(),text:g.text,done:false,rid:g.rid},g.target?{target:g.target,prog:g.prog}:{}));
    else if(g.target){ex.target=g.target;ex.prog=Math.max(ex.prog||0,g.prog);ex.done=ex.prog>=ex.target;}
  });});
  mutate(TODAY,d=>{d.goals=d.goals.filter(g=>!left.includes(g));});
  return left.length;
}

function updateMood(el,k){

function updateEnergy(el,k){
  const e=getDay(k).energy;
  if(el.firstChild){
    if(el._e===e)return;
    el._e=e;
    $$(".en-btn",el).forEach((b,i)=>b.setAttribute("aria-checked",e===i+1));

}
function autosize(ta){ta.style.height="auto";ta.style.height=Math.max(170,ta.scrollHeight)+"px";}
function goalMeta(g,k){
  const r=g.rid&&routine(g.rid);
  if(!r)return "";
  const parts=[];
  const fl=freqLabel(r);
  if(fl)parts.push('<span>'+I.repeat+esc(fl)+'</span>');
  if(r.time){
    const due=k===TODAY&&!g.done&&nowHM()>=r.time;
    parts.push('<span'+(due?' class="due"':'')+'>'+I.bell+esc(fmtTime(r.time))+(due?", due":"")+'</span>');
  }
  return parts.length?'<span class="goal-meta">'+parts.join("")+'</span>':"";
}
function updateGoals(k){
  const d=getDay(k),n=d.goals.length,done=d.goals.filter(g=>g.done).length;
  const emptyMsg=k===TODAY?"No goals for today yet. Add one below.":k===tomorrowKey()?"What do you want to get done tomorrow?":"No goals for this day.";
  // Update rows in place (rather than rebuilding the list) so ticks animate and rows slide in and out.
  $$('[data-goal-list="'+k+'"]').forEach(ul=>{
    const first=!ul._ready;ul._ready=true;
    const old=new Map();
    $$("li.goal",ul).forEach(li=>{if(!li._leaving)old.set(li.dataset.gid,li);});
    let empty=$(".goal-empty",ul);
    if(!n){
      old.forEach(li=>slideOut(li));
      if(!empty){empty=document.createElement("li");empty.className="goal-empty";ul.appendChild(empty);if(!first)slideIn(empty);}
      empty.textContent=emptyMsg;
      return;
    }
    if(empty)empty.remove();
    let prev=null;
    d.goals.forEach(g=>{
      let li=old.get(g.id),fresh=false;
      if(li){old.delete(g.id);li.classList.toggle("done",g.done);li.firstChild.setAttribute("aria-checked",g.done);}
      else{
        fresh=!first;
        li=document.createElement("li");li.className="goal"+(g.done?" done":"");li.dataset.gid=g.id;
        li.innerHTML='<button class="check" data-toggle="'+esc(g.id)+'" data-key="'+k+'" role="checkbox" aria-checked="'+g.done+'">'+I.check+'</button>'+
          '<button class="goal-main" data-edit-goal="'+esc(g.id)+'" data-key="'+k+'"></button>'+
          '<button class="del" data-del="'+esc(g.id)+'" data-key="'+k+'" aria-label="Remove goal">'+I.x+'</button>';
      }
      const inner='<span class="goal-text">'+esc(g.text)+'</span>'+goalMeta(g,k);
      if(li._inner!==inner){
        li._inner=inner;li.children[1].innerHTML=inner;
        li.firstChild.setAttribute("aria-label","Mark done: "+g.text);
        li.children[1].setAttribute("aria-label","Goal settings: "+g.text);
      }
      const pg=g.target?g.prog+"/"+g.target:"";
      if(li._pg!==pg){
        li._pg=pg;
        let box=li.children[3];
        if(!g.target){if(box)box.remove();}
        else{
          if(!box){
            box=document.createElement("div");box.className="goal-prog";
            box.innerHTML='<button class="step" data-step="-1" data-gid="'+esc(g.id)+'" data-key="'+k+'" aria-label="One less">&minus;</button><div class="bar"><i></i></div><span class="prog-n"></span>'+
              '<button class="step" data-step="1" data-gid="'+esc(g.id)+'" data-key="'+k+'" aria-label="One more">+</button>';
            li.appendChild(box);
          }
          $("i",box).style.width=(g.prog/g.target*100)+"%";
          $(".prog-n",box).textContent=pg;
        }
      }
      let ref=prev?prev.nextSibling:ul.firstChild;
      while(ref&&ref._leaving)ref=ref.nextSibling;
      if(ref!==li)ul.insertBefore(li,ref);
      prev=li;
      if(fresh)slideIn(li);
    });
    old.forEach(li=>slideOut(li));
  });
  $$('[data-goal-count="'+k+'"]').forEach(el=>el.textContent=n?done+" of "+n+" done":"");
  $$('[data-move="'+k+'"]').forEach(b=>{const left=n-done;b.hidden=!left;b.textContent="Move "+left+" unfinished to tomorrow";});
  const inDay=new Set(d.goals.map(g=>g.rid).filter(Boolean));
  const avail=S.routines.filter(r=>!inDay.has(r.id)).sort((a,b)=>b.lastUsed-a.lastUsed).slice(0,12);
  $$('[data-chips="'+k+'"]').forEach(el=>{
    el.innerHTML=avail.map(r=>'<button class="chip" data-quick="'+esc(r.id)+'" data-key="'+k+'"><b>+</b>'+esc(r.text)+'</button>').join("")+
      (S.routines.length?'<button class="chip ghost" data-open-saved>Saved goals</button>':"");
    el.hidden=!S.routines.length;
  });
}
function hydrate(root){
  $$("[data-mood-block]",root).forEach(el=>updateMood(el,el.dataset.moodBlock));
  $$("[data-energy-block]",root).forEach(el=>updateEnergy(el,el.dataset.energyBlock));
  $$("[data-prompt]",root).forEach(el=>el.textContent=PROMPTS[promptIdx(el.dataset.prompt)]);
  $$("textarea[data-text]",root).forEach(ta=>{if(document.activeElement!==ta)ta.value=getDay(ta.dataset.text).text;autosize(ta);});
  new Set($$("[data-goal-list]",root).map(el=>el.dataset.goalList)).forEach(updateGoals);
}

function buildJournal(){
  $("#view-journal").innerHTML='<header class="page-head"><div><h1>Journal</h1><p class="muted" data-jcount></p></div><button class="btn primary" data-new-note>'+I.plus+'New note</button></header>'+
    '<input type="search" class="search" data-search placeholder="Search entries, notes and goals" aria-label="Search entries"><div data-jlist></div>';
}
function renderJournal(){
  const q=($("[data-search]").value||"").trim().toLowerCase();
  const keys=Object.keys(S.days).filter(k=>k<=TODAY&&hasContent(S.days[k]));
  const count=[];
  if(keys.length)count.push(keys.length+" day"+(keys.length===1?"":"s")+" recorded");
  if(S.notes.length)count.push(S.notes.length+" note"+(S.notes.length===1?"":"s"));
  $("[data-jcount]").textContent=count.join(", ");
  const list=$("[data-jlist]");
  if(!keys.length&&!S.notes.length){list.innerHTML='<div class="empty"><p>Your entries will show up here. Start with how today is going, or write an open note about anything.</p><div class="btn-row"><button class="btn primary" data-tab="today">Write today\'s entry</button><button class="btn" data-new-note>Write a note</button></div></div>';return;}
  // Daily entries and open notes share one timeline.
  const items=[];
  keys.forEach(k=>{const d=S.days[k];if(!q||d.text.toLowerCase().includes(q)||d.goals.some(g=>g.text.toLowerCase().includes(q)))items.push({k,day:d,at:Infinity});});
  S.notes.forEach(n=>{if(!q||n.text.toLowerCase().includes(q))items.push({k:keyOf(new Date(n.createdAt)),note:n,at:n.createdAt});});
  if(!items.length){list.innerHTML='<div class="empty"><p>No entries match "'+esc(q)+'".</p></div>';return;}
  // Newest day first; within a day, the daily entry, then notes from latest to earliest.
  items.sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:b.at-a.at);
  let html="",month="";
  for(const it of items){
    const k=it.k;
    const mo=fmt(k,{month:"long",year:"numeric"});
    if(mo!==month){html+='<h2 class="month">'+esc(mo)+'</h2>';month=mo;}
    const date=esc(k===TODAY?"Today":fmt(k,{weekday:"short",day:"numeric",month:"short"}));
    if(it.note){
      const nt=it.note;
      html+='<button class="entry" data-open-note="'+esc(nt.id)+'"><span class="note-ic">'+I.pen+'</span><span class="entry-body">'+
        '<span class="entry-top"><span class="entry-date">'+date+'</span><span class="entry-meta">'+esc("Note, "+new Date(nt.createdAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))+'</span></span>'+
        '<span class="entry-text">'+esc(nt.text.trim())+'</span></span></button>';
      continue;
    }
    const d=it.day;
    const n=d.goals.length,done=d.goals.filter(g=>g.done).length;
    const meta=[];if(d.energy)meta.push(ENERGY[d.energy-1]+" energy");if(n)meta.push(done+"/"+n+" goals");
    const excerpt=d.text.trim()||(d.mood||d.energy?"Checked in, no journal entry.":n+" goal"+(n===1?"":"s")+" set.");
    html+='<button class="entry" data-open-day="'+k+'"><span class="f">'+face(d.mood,40)+'</span><span class="entry-body">'+
      '<span class="entry-top"><span class="entry-date">'+date+'</span><span class="entry-meta">'+esc(meta.join(", "))+'</span></span>'+
      '<span class="entry-text">'+esc(excerpt)+'</span></span></button>';
  }
  list.innerHTML=html;
}

/* Open notes: journal entries that aren't tied to a day's check-in. Each gets a full page to write on. */
let editN=null; // id of the note being written; null until a new note has some text
let noteOpen=false;
// Keep the page above the iPhone keyboard so the line being typed stays in view.
function fitComposer(){
  const v=window.visualViewport;
  if(!noteOpen||!v)return;
  const c=$("#composer");
  c.style.height=v.height+"px";c.style.top=v.offsetTop+"px";
}
function openNote(id){
  const n=id?S.notes.find(x=>x.id===id):null;
  editN=n?n.id:null;
  const when=n?new Date(n.createdAt).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"New note";
  const c=$("#composer");
  c.innerHTML='<header class="composer-bar"><button class="link" data-n-done>Done</button><span class="muted small">'+esc(when)+'</span>'+
    (n?'<button class="link composer-end" data-n-delete>Delete</button>':'<span class="composer-end muted small">Saves as you write</span>')+'</header>'+
    '<textarea class="composer-text" data-n-text placeholder="Write anything…" aria-label="Note">'+esc(n?n.text:"")+'</textarea>';
  noteOpen=true;
  c.classList.add("open");
  document.body.style.overflow="hidden";
  fitComposer();
  // Focus straight away for a new note so the keyboard comes up with the page.
  if(!n)$("[data-n-text]",c).focus({preventScroll:true});
}
function closeNote(){
  if(!noteOpen)return;
  noteOpen=false;
  const c=$("#composer"),t=$("[data-n-text]",c);
  if(t)t.blur();
  finishNote();
  c.classList.remove("open");
  if(!sheetOpen[1]&&!sheetOpen[2])document.body.style.overflow="";
  setTimeout(()=>{if(!noteOpen){c.innerHTML="";c.style.height="";c.style.top="";}},480);
  renderAll();
}
function writeNote(text){
  let n=editN&&S.notes.find(x=>x.id===editN);
  if(!n){
    if(!text.trim())return;
    n=cleanNote({});S.notes.push(n);editN=n.id;
  }
  n.text=text;n.updatedAt=Date.now();
  saveSoon();
}
function finishNote(){

const longLabel=g=>g.pct?g.prog+"%":g.prog+" of "+g.target;
function longMeta(g){
  const bits=[longLabel(g)];
  if(g.due)bits.push((g.due<TODAY?"was due ":"by ")+fmt(g.due,{day:"numeric",month:"short",year:g.due.slice(0,4)===TODAY.slice(0,4)?undefined:"numeric"}));
  return bits.join(" · ");
}
function setLongProg(g,p){
  g.prog=clamp(p,g.target);g.updatedAt=Date.now();
  if(g.prog>=g.target){if(!g.doneAt)g.doneAt=Date.now();}else g.doneAt=0;
}
function longCard(g){
  return '<div class="lg"><button class="lg-main" data-open-long="'+esc(g.id)+'"><span class="lg-title">'+esc(g.text)+'</span><span class="lg-meta'+(g.due&&g.due<TODAY?" due":"")+'">'+esc(longMeta(g))+'</span></button>'+
    '<div class="lg-row"><div class="lg-slide" data-lslide="'+esc(g.id)+'" role="slider" tabindex="0" aria-label="Progress" aria-valuemin="0" aria-valuemax="'+g.target+'" aria-valuenow="'+g.prog+'" style="--p:'+g.prog/g.target+'"><div class="bar"><i></i></div><b class="lg-knob"></b></div>'+
    '<label class="lg-num"><input type="number" inputmode="numeric" min="0" max="'+g.target+'" value="'+g.prog+'" placeholder="0" data-lnum="'+esc(g.id)+'" aria-label="Amount done"><span>'+(g.pct?"%":"of "+g.target)+'</span></label></div></div>';
}
// Show a value on a card (while dragging or typing, before it is saved).
function showLong(card,g,v){
  const sl=$("[data-lslide]",card),num=$("[data-lnum]",card);
  sl.style.setProperty("--p",v/g.target);sl.setAttribute("aria-valuenow",v);
  if(document.activeElement!==num)num.value=v;
  $(".lg-meta",card).textContent=longMeta(Object.assign({},g,{prog:v}));
}
function applyLong(g,v,card){
  const was=!!g.doneAt;
  setLongProg(g,v);save();
  if(g.doneAt&&!was){toast("Goal complete. Nice work.");renderLongs();return;}
  showLong(card,g,g.prog);

function renderLongs(){

let editL=null; // working copy {id, text, pct, target, prog, due, done}
const draftMax=L=>L.pct?100:cleanLongTarget(L.target);
function openLong(id){

function commitLong(){
  const L=editL;if(!L)return null;
  const text=L.text.trim(),target=draftMax(L);
  if(!text){toast("Give the goal a name first.");return null;}
  if(!target){toast("Set a target of 2 or more.");return null;}
  let g=L.id&&S.longs.find(x=>x.id===L.id);
  if(!g){g=cleanLong({text});S.longs.push(g);}
  g.text=text;g.pct=L.pct;g.target=target;g.due=KEY_RE.test(L.due)?L.due:"";
  setLongProg(g,L.prog);

/* Drag a long-term goal's bar to set how far along it is */
let slide=null;
function slideTo(s,x){
  const r=s.el.getBoundingClientRect(),f=Math.max(0,Math.min(1,(x-r.left-11)/(r.width-22)));
  let v=Math.round(f*s.g.target);
  if(s.g.pct)v=Math.round(v/5)*5; // percent moves in fives; the box takes an exact figure
  s.val=v;showLong(s.el.closest(".lg"),s.g,v);
}
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const el=e.target.closest&&e.target.closest("[data-lslide]");if(!el)return;
  const g=S.longs.find(x=>x.id===el.dataset.lslide);if(!g)return;
  slide={el,g,id:e.pointerId,x:e.clientX,y:e.clientY,on:false,val:g.prog};
});
document.addEventListener("pointermove",e=>{
  const s=slide;if(!s||e.pointerId!==s.id)return;
  if(!s.on){
    const dx=e.clientX-s.x,dy=e.clientY-s.y;
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){slide=null;return;} // it's a scroll
    if(Math.abs(dx)<6)return;
    s.on=true;s.el.classList.add("drag");
    try{s.el.setPointerCapture(e.pointerId);}catch(err){}
  }
  slideTo(s,e.clientX);
});
function endSlide(e,cancelled){
  const s=slide;if(!s||e.pointerId!==s.id)return;
  slide=null;s.el.classList.remove("drag");
  const card=s.el.closest(".lg");
  if(cancelled){showLong(card,s.g,s.g.prog);return;}
  if(!s.on)slideTo(s,e.clientX); // a tap on the bar jumps to that spot
  applyLong(s.g,s.val,card);
}
document.addEventListener("pointerup",e=>endSlide(e,false));
document.addEventListener("pointercancel",e=>endSlide(e,true));
document.addEventListener("keydown",e=>{
  const el=e.target.closest&&e.target.closest("[data-lslide]"),d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];
  if(!el||!d)return;
  const g=S.longs.find(x=>x.id===el.dataset.lslide);if(!g)return;
  e.preventDefault();applyLong(g,g.prog+d*(g.pct?5:1),el.closest(".lg"));
});
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches("[data-lnum]"))e.target.select();});

function renderInsights(){
  const s=streaks();
  let gT=0,gD=0;
  // Finished goals that were later cleared from a list still count; goals removed unfinished don't count at all.
  for(const k in S.days){if(k>TODAY)continue;const d=S.days[k],gone=d.gone||0;gT+=d.goals.length+gone;gD+=d.goals.filter(g=>g.done).length+gone;}

  const startLbl=esc(fmt(days[0],{day:"numeric",month:"short"}));

  const moods=days.map(k=>getDay(k).mood),logged=moods.filter(Boolean);
  if(!logged.length){$("[data-mood-chart]").innerHTML='<p class="muted" style="margin:0">Log your mood for a few days to see your trend here.</p>';$("[data-mood-avg]").textContent="";}
  else{
    const W=320,L=30,R=8,T=12,step=(W-L-R)/29,y=m=>T+(5-m)*26,x=i=>L+i*step;
    let svg='<svg viewBox="0 0 '+W+' 136" role="img" aria-label="Mood over the last 30 days">';
    for(let m=1;m<=5;m++)svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(m)+'" y2="'+y(m)+'" stroke="var(--line)" stroke-dasharray="2 4"/><circle cx="10" cy="'+y(m)+'" r="6" fill="var(--m'+m+')"/>';
    for(let i=0;i<29;i++)if(moods[i]&&moods[i+1])svg+='<line x1="'+x(i)+'" y1="'+y(moods[i])+'" x2="'+x(i+1)+'" y2="'+y(moods[i+1])+'" stroke="var(--line-strong)" stroke-width="2" stroke-linecap="round"/>';
    moods.forEach((m,i)=>{if(m)svg+='<circle cx="'+x(i)+'" cy="'+y(m)+'" r="4.5" fill="var(--m'+m+')" stroke="var(--surface)" stroke-width="1.5"/>';});
    $("[data-mood-chart]").innerHTML=svg+'</svg><div class="axis pl"><span>'+startLbl+'</span><span>Today</span></div>';
    $("[data-mood-avg]").textContent="Average: "+MOODS[Math.round(logged.reduce((a,b)=>a+b,0)/logged.length)-1];
  }

  const ens=days.map(k=>getDay(k).energy),eLogged=ens.filter(Boolean);
  if(!eLogged.length){$("[data-en-chart]").innerHTML='<p class="muted" style="margin:0">Log your energy each day to see how it changes.</p>';$("[data-en-avg]").textContent="";}
  else{
    const W=320,H=100,bw=(W-29*3)/30;
    let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Energy over the last 30 days">';
    ens.forEach((e,i)=>{
      const x=i*(bw+3);
      svg+='<rect x="'+x+'" y="0" width="'+bw+'" height="'+H+'" rx="3" fill="var(--bg)"/>';
      if(e){const h=e/5*H;svg+='<rect x="'+x+'" y="'+(H-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+(e>=4?"var(--accent)":"var(--energy)")+'"/>';}
    });

    $("[data-en-avg]").textContent="Average: "+ENERGY[Math.round(eLogged.reduce((a,b)=>a+b,0)/eLogged.length)-1];
  }

  const counts=[0,0,0,0,0];logged.forEach(m=>counts[m-1]++);
  $("[data-mix]").innerHTML=logged.length
    ?'<div class="mix">'+counts.map((c,i)=>c?'<i style="width:'+(c/logged.length*100)+'%;background:var(--m'+(i+1)+')"></i>':"").join("")+'</div><div class="legend">'+MOODS.map((l,i)=>'<span><i style="background:var(--m'+(i+1)+')"></i>'+l+" "+counts[i]+'</span>').join("")+'</div>'
    :'<p class="muted" style="margin:0">Nothing logged in the last 30 days.</p>';

function renderCal(){

      // Always in the sheet and only shown or hidden, so the time picker is never rebuilt while it's open.

        '<p class="hint">Stoa can\'t notify you by itself. This opens Google Calendar with the goal filled in for <span data-r-at>'+esc(fmtTime(R.time))+'</span>'+(R.freq==="once"?"":", repeating on the same days")+'. Tap Save there and Google reminds you, even when Stoa is closed. It uses your calendar\'s default notification, usually 30 minutes before, which you can change on that screen. <button class="link" data-r-cal>Use iPhone Calendar instead</button></p>'+
      '</div>'+

  if(sheetOpen[2]){const sh=$("#sheet2"),st=sh.scrollTop;sh.innerHTML='<div class="grab"></div>'+html;sh.scrollTop=st;}
  else openSheet(2,html);
}
function commitRoutine(){
  const R=editR;if(!R)return null;
  const r=routine(R.id);if(!r)return null;
  const text=R.text.trim();
  if(!text){toast("Give the goal a name first.");return null;}
  if(R.freq==="custom"&&!R.days.length){toast("Pick at least one day.");return null;}
  const target=R.track?cleanTarget(R.target):0;
  if(R.track&&!target){toast("Set a target of 2 or more.");return null;}
  r.text=text;r.freq=R.freq;r.days=R.freq==="custom"?R.days.slice():[];r.time=R.remind?R.time:"";r.target=target;
  const mine=R.gid&&S.days[R.ctx]?S.days[R.ctx].goals.find(x=>x.id===R.gid):null;
  for(const k in S.days){if(k<TODAY)continue;S.days[k].goals.forEach(g=>{if(g.rid!==r.id)return;if(!g.done)g.text=text;setTarget(g,target);});}
  if(mine){setTarget(mine,target);if(target){mine.prog=clamp(R.prog,target);mine.done=mine.prog>=target;}}
  seedUpcoming();
  save();
  return r;
}

/* =========================================================
   Calendar reminders (.ics)
   ========================================================= */
const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
function icsText(s){return String(s).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function stampUTC(){const d=new Date();return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+"Z";}
function firstDate(r,ctx){
  if(r.freq==="once"){
    if(ctx&&ctx>=TODAY&&!(ctx===TODAY&&nowHM()>=r.time))return ctx;
    return nowHM()<r.time?TODAY:tomorrowKey();
  }
  let k=TODAY;
  for(let i=0;i<8;i++){if(repeatsOn(r,k))return k;k=addDays(k,1);}
  return TODAY;
}
function rrule(r){
  if(r.freq==="daily")return "FREQ=DAILY";
  if(r.freq==="weekdays")return "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR";
  if(r.freq==="weekends")return "FREQ=WEEKLY;BYDAY=SA,SU";
  if(r.freq==="custom"&&r.days.length)return "FREQ=WEEKLY;BYDAY="+r.days.map(d=>BYDAY[d]).join(",");
  return "";
}
// Google Calendar's "new event" page, filled in from the link. No sign-in or key is needed inside Stoa.
function gcalUrl(r,ctx){
  const k=firstDate(r,ctx),hm=r.time.split(":").map(Number),end=parseKey(k);
  end.setHours(hm[0],hm[1]+15);
  const q=new URLSearchParams({
    action:"TEMPLATE",text:r.text,details:"Goal from Stoa",
    dates:k.replace(/-/g,"")+"T"+pad(hm[0])+pad(hm[1])+"00/"+keyOf(end).replace(/-/g,"")+"T"+pad(end.getHours())+pad(end.getMinutes())+"00"
  });
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(tz)q.set("ctz",tz);}catch(e){}
  const rule=rrule(r);if(rule)q.set("recur","RRULE:"+rule);
  return "https://calendar.google.com/calendar/render?"+q;
}
function openGcal(r,ctx){
  const u=gcalUrl(r,ctx);
  // From the home-screen app, a link to another site opens in a browser sheet on top of Stoa.
  if(isIOS&&standalone){window.location.href=u;return;}
  const w=window.open(u,"_blank");
  if(w){try{w.opener=null;}catch(e){}}else window.location.href=u;
}
function vevent(r,ctx){
  const k=firstDate(r,ctx),t=r.time.replace(":","");
  const L=["BEGIN:VEVENT","UID:"+r.id+"-"+Date.now()+"@stoa.app","DTSTAMP:"+stampUTC(),"DTSTART:"+k.replace(/-/g,"")+"T"+t+"00","DURATION:PT15M","SUMMARY:"+icsText(r.text),"DESCRIPTION:"+icsText("Goal from Stoa")];
  const rule=rrule(r);if(rule)L.push("RRULE:"+rule);
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(r.text),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  return L;
}
const buildIcs=events=>["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Stoa//Journal//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"].concat(...events,["END:VCALENDAR"]).join("\r\n");
function openIcs(events,name){
  const ics=buildIcs(events);
  if(isIOS&&standalone&&location.protocol==="https:"){
    // A home-screen app can't open calendar data itself, so hand it to Safari, which shows the "Add to Calendar" prompt.
    // The event travels after the # so it is never sent to a server.
    window.location.href="x-safari-"+new URL("cal.html",location.href).href+"#"+encodeURIComponent(ics);
    return;
  }
  if(isIOS){
    // Safari on iPhone opens calendar data with an "Add to Calendar" prompt.
    window.location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
    return;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download=name+".ics";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"goal";

/* =========================================================
   Backup
   ========================================================= */
async function exportData(){
  const data=JSON.stringify({app:"stoa",version:2,exportedAt:new Date().toISOString(),profile:S.profile,settings:S.settings,days:S.days,routines:S.routines,quotes:S.quotes,notes:S.notes,longs:S.longs},null,2);
  const name="stoa-backup-"+TODAY+".json";
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Stoa backup"});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("Backup saved");
}
function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const obj=JSON.parse(fr.result);
      if(!obj||typeof obj.days!=="object")throw 0;
      let n=0;
      for(const k in obj.days){
        if(!KEY_RE.test(k))continue;
        const inc=cleanDay(obj.days[k]),cur=S.days[k];
        if(!cur||inc.updatedAt>cur.updatedAt){S.days[k]=inc;n++;}
      }
      (obj.routines||[]).forEach(r=>{const c=cleanRoutine(r);if(c.text&&!routine(c.id)&&!S.routines.some(x=>x.text.toLowerCase()===c.text.toLowerCase()))S.routines.push(c);});
      (obj.quotes||[]).forEach(q=>{
        const c=cleanQuote(q);if(!c.text)return;
        const cur=S.quotes.find(x=>x.id===c.id||x.text===c.text);
        if(!cur)S.quotes.push(c);else if(c.note&&!cur.note)cur.note=c.note;
      });
      (obj.notes||[]).forEach(x=>{
        const c=cleanNote(x);if(!c.text.trim())return;
        const cur=S.notes.find(y=>y.id===c.id);
        if(!cur)S.notes.push(c);else if(c.updatedAt>cur.updatedAt){cur.text=c.text;cur.updatedAt=c.updatedAt;}
      });
      (obj.longs||[]).forEach(x=>{
        const c=cleanLong(x);if(!c.text)return;
        const i=S.longs.findIndex(y=>y.id===c.id);
        if(i<0)S.longs.push(c);else if(c.updatedAt>S.longs[i].updatedAt)S.longs[i]=c;
      });
      if(obj.profile&&obj.profile.name&&!S.profile.name)S.profile.name=String(obj.profile.name).slice(0,40);
      // Older backups: give their goals a saved-goal entry
      for(const k in S.days)S.days[k].goals.forEach(g=>{if(!g.rid){const r=findOrCreateRoutine(g.text);r.lastUsed=0;g.rid=r.id;}});
      save();renderToday();renderAll();
      toast(n?"Imported "+n+" day"+(n===1?"":"s"):"Backup imported");
    }catch(e){toast("That file isn't a Stoa backup.");}
  };
  fr.readAsText(file);
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a[data-r-gcal],[data-close-sheet],[data-open-day]");
  if(!t)return;
  const ds=t.dataset;

  if(t.hasAttribute("data-close-sheet")){const n=ds.closeSheet||(t.closest("#sheet2")?"2":"1");closeSheet(+n);return;}
  if(ds.tab){if(sheetOpen[2])closeSheet(2);if(sheetOpen[1])closeSheet(1);switchTab(ds.tab);return;}
  if(ds.openDay){openDay(ds.openDay);return;}

  // mood / energy
  if(ds.mood){const k=ds.key,v=+ds.mood;mutate(k,d=>{d.mood=d.mood===v?0:v;});popFace();return;}
  if(ds.energy){const k=ds.key,v=+ds.energy;mutate(k,d=>{d.energy=d.energy===v?0:v;});return;}

  // goals
  if(ds.toggle){
    const k=ds.key;let all=false;
    mutate(k,d=>{
      const g=d.goals.find(x=>x.id===ds.toggle);if(!g)return;
      if(!g.target)g.done=!g.done;
      else if(g.done){g.prog=Math.min(g.was||0,g.target-1);g.done=false;} // back to where it was before the tick
      else{g.was=g.prog;g.prog=g.target;g.done=true;}
      all=g.done&&d.goals.every(x=>x.done);
    });
    if(all&&k===TODAY)toast("All of today's goals done. Nice work.");
    return;
  }
  if(ds.step){
    const k=ds.key;let all=false;
    mutate(k,d=>{
      const g=d.goals.find(x=>x.id===ds.gid);if(!g||!g.target)return;
      const was=g.done;
      g.prog=clamp(g.prog+ +ds.step,g.target);g.done=g.prog>=g.target;
      all=!was&&g.done&&d.goals.every(x=>x.done);
    });
    if(all&&k===TODAY)toast("All of today's goals done. Nice work.");
    return;
  }
  if(ds.del){
    // Clearing a finished goal keeps its credit in Insights; removing an unfinished one leaves no trace.
    mutate(ds.key,d=>{const g=d.goals.find(x=>x.id===ds.del);if(g&&g.done)d.gone=(d.gone||0)+1;d.goals=d.goals.filter(x=>x.id!==ds.del);});
    return;
  }
  if(ds.addGoal){const inp=t.closest(".goal-add").querySelector("input");if(addGoalText(ds.addGoal,inp.value))inp.value="";inp.focus();return;}
  if(ds.quick){const r=routine(ds.quick);if(r){r.lastUsed=Date.now();addGoalText(ds.key,r.text);}return;}
  if(ds.editGoal){
    const k=ds.key,g=getDay(k).goals.find(x=>x.id===ds.editGoal);if(!g)return;
    if(!g.rid||!routine(g.rid)){const r=findOrCreateRoutine(g.text);g.rid=r.id;save();}
    openRoutine(g.rid,k,g.id);return;
  }
  if(ds.move){
    const m=moveToTomorrow(null);
    if(m)toast("Moved "+m+" goal"+(m===1?"":"s")+" to tomorrow");
    return;
  }

  // long-term goals
  if(t.hasAttribute("data-new-long")){openLong(null);return;}
  if(ds.openLong){openLong(ds.openLong);return;}
  if(ds.lPct&&editL){
    const pct=ds.lPct==="1";if(pct===editL.pct)return;
    const from=draftMax(editL)||10;
    editL.pct=pct;
    editL.prog=Math.round(editL.prog/from*(draftMax(editL)||10)); // keep the same share done
    renderLong();return;
  }
  if(t.hasAttribute("data-l-save")&&editL){
    const was=editL.done,g=commitLong();
    if(g){toast(g.doneAt&&!was?"Goal complete. Nice work.":"Goal saved");closeSheet(2);}
    return;
  }
  if(t.hasAttribute("data-l-done")&&editL){
    const max=draftMax(editL),was=editL.done;
    if(!max){toast("Set a target of 2 or more.");return;}
    editL.prog=was?Math.min(editL.prog,max-1):max;
    if(commitLong()){toast(was?"Goal reopened":"Goal complete. Nice work.");closeSheet(2);}
    return;
  }
  if(t.hasAttribute("data-l-delete")&&editL){
    if(!ds.sure){ds.sure="1";t.textContent="Tap again to delete";return;}
    S.longs=S.longs.filter(x=>x.id!==editL.id);save();toast("Goal deleted");closeSheet(2);return;
  }

  // saved goals & goal settings
  if(t.hasAttribute("data-open-saved")){openSaved();return;}
  if(ds.openRoutine){openRoutine(ds.openRoutine,null);return;}
  if(t.hasAttribute("data-add-routine")){
    const inp=$("[data-new-routine]"),v=inp.value.trim();if(!v){inp.focus();return;}
    if(S.routines.some(x=>x.text.toLowerCase()===v.toLowerCase())){toast("That goal is already saved.");return;}
    const r=cleanRoutine({text:v,freq:"once"});S.routines.push(r);save();openRoutine(r.id,null);return;
  }
  if(ds.rFreq&&editR){editR.freq=ds.rFreq;if(editR.freq==="custom"&&!editR.days.length)editR.days=[parseKey(TODAY).getDay()];renderRoutine();return;}
  if(ds.rDay&&editR){const d=+ds.rDay;editR.days=editR.days.includes(d)?editR.days.filter(x=>x!==d):editR.days.concat(d);renderRoutine();return;}
  if(t.hasAttribute("data-r-save")){
    const R=editR,r=commitRoutine();
    if(r){
      const cal=calPending(R);
      toast("Goal saved");closeSheet(2);
      if(cal)openGcal(r,R.ctx);
    }
    return;
  }
  if(t.hasAttribute("data-r-gcal")){
    // Save first, then let the link itself open Google Calendar.
    const r=commitRoutine();
    if(!r||!r.time){e.preventDefault();return;}
    editR.calSig=remSig(r);syncRemind();t.href=gcalUrl(r,editR.ctx);
    return;
  }
  if(t.hasAttribute("data-r-cal")){
    const r=commitRoutine();
    if(r&&r.time){editR.calSig=remSig(r);syncRemind();openIcs([vevent(r,editR.ctx)],slug(r.text));}
    return;
  }
  if(t.hasAttribute("data-r-move")&&editR){
    const gid=editR.gid;
    if(commitRoutine()){const m=moveToTomorrow([gid]);closeSheet(2);toast(m?"Moved to tomorrow":"Goal saved");}
    return;
  }
  if(t.hasAttribute("data-r-delete")&&editR){
    S.routines=S.routines.filter(x=>x.id!==editR.id);save();
    toast("Removed from saved goals. It stays on any lists it's already on.");closeSheet(2);return;
  }
  if(t.hasAttribute("data-cal-all")){
    const rs=S.routines.filter(r=>r.time&&r.freq!=="once");
    if(rs.length)openIcs(rs.map(r=>vevent(r,null)),"stoa-reminders");return;
  }

  // quotes
  if(t.hasAttribute("data-new-quote")){openQuote(null);return;}

  // open notes
  if(t.hasAttribute("data-new-note")){openNote(null);return;}
  if(ds.openNote){openNote(ds.openNote);return;}
  if(t.hasAttribute("data-n-done")){closeNote();return;}
  if(t.hasAttribute("data-n-delete")&&editN){
    if(!ds.sure){ds.sure="1";t.textContent="Tap again";t.style.color="var(--accent)";return;}
    S.notes=S.notes.filter(x=>x.id!==editN);editN=null;save();toast("Note deleted");closeNote();return;
  }

  if(ds.editQuote){openQuote(ds.editQuote);return;}
  if(ds.fav){const q=S.quotes.find(x=>x.id===ds.fav);if(q){q.fav=!q.fav;save();renderAll();const h=$$("[data-fav]").find(b=>b.dataset.fav===ds.fav);if(h&&q.fav)h.classList.add("pop");}return;}
  if(ds.qopen){
    const box=$(".qnote",t.parentNode),open=!qOpen.has(ds.qopen);
    if(open)qOpen.add(ds.qopen);else qOpen.delete(ds.qopen);
    t.setAttribute("aria-expanded",open);
    if(open)expand(box);else collapse(box);
    return;
  }
  if(ds.qfilter){quoteFilter=ds.qfilter;renderQuotes();return;}
  if(t.hasAttribute("data-next-quote")){qShift++;renderQuotes();updateQuoteStrip();return;}
  if(t.hasAttribute("data-q-save")){
    const text=$("[data-q-text]").value.trim(),author=$("[data-q-author]").value.trim(),note=$("[data-q-note]").value.trim();
    if(!text){toast("Type the quote first.");$("[data-q-text]").focus();return;}
    if(editQ){const q=S.quotes.find(x=>x.id===editQ);if(q){q.text=text;q.author=author;q.note=note;}}
    else S.quotes.push(cleanQuote({text,author,note}));
    save();toast(editQ?"Quote updated":"Quote saved");closeSheet(2);return;
  }
  if(t.hasAttribute("data-q-delete")&&editQ){S.quotes=S.quotes.filter(x=>x.id!==editQ);editQ=null;save();toast("Quote deleted");closeSheet(2);return;}

  // settings
  if(t.hasAttribute("data-open-settings")){openSettings();return;}
  if(ds.sTheme){S.settings.theme=ds.sTheme;save();themeFade();applyTheme();$$("[data-s-theme]").forEach(b=>b.setAttribute("aria-checked",b.dataset.sTheme===ds.sTheme));return;}
  if(t.hasAttribute("data-export")){exportData();return;}

  // calendar nav
  if(ds.cal){cal.m+=+ds.cal;if(cal.m<0){cal.m=11;cal.y--;}if(cal.m>11){cal.m=0;cal.y++;}renderCal();const g=$(".cal");if(g)g.classList.add("fade");return;}

  // welcome
  if(t.hasAttribute("data-w-go")){finishWelcome($("[data-w-name]").value);return;}
  if(t.hasAttribute("data-w-skip")){finishWelcome("");return;}
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(noteOpen)closeNote();else if(sheetOpen[2])closeSheet(2);else if(sheetOpen[1])closeSheet(1);return;}
  if(e.key!=="Enter"||e.isComposing)return;
  const gi=e.target.closest&&e.target.closest("input[data-goal-input]");
  if(gi){e.preventDefault();if(addGoalText(gi.dataset.goalInput,gi.value))gi.value="";return;}
  if(e.target.matches("[data-new-routine]")){e.preventDefault();$("[data-add-routine]").click();return;}
  if(e.target.matches("[data-w-name]")){e.preventDefault();finishWelcome(e.target.value);return;}
  if(e.target.matches("[data-r-text],[data-s-name],[data-l-text],[data-r-target],[data-r-prog],[data-l-target],[data-lnum]")){e.preventDefault();e.target.blur();}
});

const saveLabels={};
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.matches("textarea[data-text]")){
    const k=el.dataset.text;
    autosize(el);
    mutate(k,d=>{d.text=el.value;},true);
    $$('textarea[data-text="'+k+'"]').forEach(o=>{if(o!==el){o.value=el.value;autosize(o);}});
    $$('[data-save="'+k+'"]').forEach(s=>s.textContent="Saving…");
    clearTimeout(saveLabels[k]);
    saveLabels[k]=setTimeout(()=>$$('[data-save="'+k+'"]').forEach(s=>s.textContent="Saved"),600);
    return;
  }
  if(el.matches("[data-search]")){renderJournal();return;}
  if(el.matches("[data-lnum]")){
    // Typing moves the bar straight away; the figure is saved when the box is left.
    const g=S.longs.find(x=>x.id===el.dataset.lnum);
    if(g&&el.value.trim()!=="")showLong(el.closest(".lg"),g,clamp(el.value,g.target));
    return;
  }
  if(el.matches("[data-n-text]")){writeNote(el.value);return;}
  if(el.matches("[data-r-text]")&&editR){editR.text=el.value;return;}
  if(el.matches("[data-r-target]")&&editR){editR.target=el.value;return;}
  if(el.matches("[data-r-prog]")&&editR){editR.prog=el.value;return;}
  if(editL){
    if(el.matches("[data-l-text]")){editL.text=el.value;return;}
    if(el.matches("[data-l-due]")){editL.due=el.value;return;}
    if(el.matches("[data-l-prog]")){editL.prog=+el.value;syncLong();return;}
    if(el.matches("[data-l-target]")){
      editL.target=el.value;
      const m=draftMax(editL),r=$("[data-l-prog]");
      if(m&&r){r.max=m;editL.prog=Math.min(editL.prog,m);r.value=editL.prog;}
      syncLong();return;
    }
  }
  if(el.matches("[data-r-time]")&&editR){editR.time=el.value||"08:00";syncRemind();return;}
  if(el.matches("[data-s-name]")){S.profile.name=el.value.trim().slice(0,40);S.profile.onboarded=true;saveSoon();updateHeader();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches("[data-r-track]")&&editR){editR.track=el.checked;const m=$("[data-r-trackmore]");if(m){m.hidden=!el.checked;m.classList.toggle("reveal",el.checked);}return;}
  if(el.matches("[data-l-due]")&&editL){editL.due=el.value;return;}
  if(el.matches("[data-lnum]")){
    const g=S.longs.find(x=>x.id===el.dataset.lnum);if(!g)return;
    if(el.value.trim()===""){el.value=g.prog;showLong(el.closest(".lg"),g,g.prog);return;} // left empty: keep what was there
    const v=clamp(el.value,g.target);
    el.value=v;applyLong(g,v,el.closest(".lg"));
    return;
  }
  // Show or hide in place: rebuilding the sheet here would close the iPhone time picker mid-scroll.
  if(el.matches("[data-r-remind]")&&editR){
    editR.remind=el.checked;
    const m=$("[data-r-more]");if(m){m.hidden=!el.checked;m.classList.toggle("reveal",el.checked);}
    syncRemind();return;
  }
  if(el.matches("[data-r-time]")&&editR){editR.time=el.value||"08:00";syncRemind();return;}
  if(el.matches("[data-import]")){const f=el.files&&el.files[0];if(f)importData(f);el.value="";}
});

function checkDate(){
  const k=keyOf(new Date());
  if(k!==TODAY){TODAY=k;qShift=0;renderToday();renderAll();}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){if(saveTimer)save();return;}
  checkDate();renderAll();
});
window.addEventListener("pagehide",()=>{if(saveTimer)save();});
window.addEventListener("resize",()=>$$("textarea[data-text]").forEach(autosize));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
// No pinch zoom: iPhone ignores the viewport setting on its own, so stop the gesture too.
document.addEventListener("gesturestart",e=>e.preventDefault());
if(window.visualViewport){visualViewport.addEventListener("resize",fitComposer);visualViewport.addEventListener("scroll",fitComposer);}
// Lets the :active press states show on iPhone.
document.addEventListener("touchstart",()=>{},{passive:true});
setInterval(()=>{checkDate();if(document.visibilityState==="visible"&&!document.activeElement.matches("input,textarea"))$$("[data-goal-list]").forEach(el=>updateGoals(el.dataset.goalList));},60000);

/* =========================================================
   Start
   ========================================================= */
applyTheme();
renderToday();
buildJournal();
buildInsights();
switchTab("today");
if(!S.profile.onboarded)showWelcome();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
</script>
</body>
</html>
