/* =========================================================
   Swiping goals
   ========================================================= */
const SWIPE_GO=72; // how far a goal has to be dragged before letting go acts
let swipe=null,swipedAt=0;
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const li=e.target.closest&&e.target.closest("li.goal");
  if(!li||li._leaving)return;
  const k=li.firstChild.dataset.key,g=getDay(k).goals.find(x=>x.id===li.dataset.gid);
  if(!g)return;
  swipe={li,k,g,id:e.pointerId,x:e.clientX,y:e.clientY,on:false};
});
document.addEventListener("pointermove",e=>{
  const s=swipe;if(!s||e.pointerId!==s.id)return;
  const dx=e.clientX-s.x,dy=e.clientY-s.y;
  if(!s.on){
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){swipe=null;return;} // it's a scroll
    if(Math.abs(dx)<10)return;
    s.on=true;s.li.classList.add("swiping");
    try{s.li.setPointerCapture(e.pointerId);}catch(err){}
  }
  // Right ticks it off (or adds one step); left sends today's goal to tomorrow. A finished goal only gives a little.
  const ok=!s.g.done&&(dx>0||s.k===TODAY),x=ok?dx:dx*.15;
  s.li.dataset.swipe=dx<0?"move":s.g.target?"step":"done";
  s.li.style.setProperty("--sx",x+"px");
  s.li.style.setProperty("--sp",ok?Math.min(1,Math.abs(x)/SWIPE_GO):0);
  s.li.classList.toggle("armed",ok&&Math.abs(dx)>=SWIPE_GO);
});
function endSwipe(e,cancelled){
  const s=swipe;if(!s||e.pointerId!==s.id)return;
  swipe=null;
  if(!s.on)return;
  swipedAt=Date.now();
  const li=s.li,go=!cancelled&&li.classList.contains("armed"),dir=li.dataset.swipe;
  li.classList.remove("swiping","armed");
  const settle=()=>{li.style.removeProperty("--sx");li.style.removeProperty("--sp");setTimeout(()=>{if(!li.classList.contains("swiping"))delete li.dataset.swipe;},320);};
  if(go&&!S.settings.swiped){S.settings.swiped=true;save();}
  if(go&&dir==="move"){
    li.style.setProperty("--sx",-(li.offsetWidth+24)+"px");
    setTimeout(()=>{if(moveToTomorrow([s.g.id]))toast("Moved to tomorrow");else settle();},200);
    return;
  }
  settle();
  if(go){if(dir==="step")stepGoal(s.k,s.g.id,1,li);else tickGoal(s.k,s.g.id,li);}
}
document.addEventListener("pointerup",e=>endSwipe(e,false));
document.addEventListener("pointercancel",e=>endSwipe(e,true));
// Letting go at the end of a swipe must not also count as a tap on whatever is under the finger.
window.addEventListener("click",e=>{if(Date.now()-swipedAt<350){e.stopImmediatePropagation();e.preventDefault();}},true);

/* =========================================================
   Events
   ========================================================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a[data-r-gcal],[data-close-sheet],[data-open-day]");
  if(!t)return;
  const ds=t.dataset;

  // passcode keypad
  if(ds.kp){kpDigit(ds.kp);return;}
  if(t.hasAttribute("data-kp-del")){kpDel();return;}
  if(t.hasAttribute("data-kp-cancel")){firstPin="";hideLock();return;}
  if(t.hasAttribute("data-kp-forgot")){showForgot();return;}
  if(t.hasAttribute("data-kp-bio")){bioUnlock();return;}
  if(t.hasAttribute("data-kp-back")){showLock("unlock");return;}
  if(t.hasAttribute("data-kp-erase")){
    if(!ds.sure){ds.sure="1";t.textContent="Tap again: this erases everything";return;}
    eraseAll();return;
  }
  if(t.hasAttribute("data-lock-set")){showLock("set1");return;}
  if(t.hasAttribute("data-lock-change")){showLock("change");return;}
  if(t.hasAttribute("data-lock-off")){showLock("off");return;}
  if(ds.lockAfter){const c=lockConf();if(c){c.after=+ds.lockAfter;localStorage.setItem(LOCK_KEY,JSON.stringify(c));lockRefresh();}return;}

  if(t.hasAttribute("data-close-sheet")){const n=ds.closeSheet||(t.closest("#sheet2")?"2":"1");closeSheet(+n);return;}
  if(ds.tab){if(sheetOpen[2])closeSheet(2);if(sheetOpen[1])closeSheet(1);switchTab(ds.tab);return;}
  if(ds.openDay){openDay(ds.openDay);return;}

  // mood / energy
  if(ds.mood){const k=ds.key,v=+ds.mood;mutate(k,d=>{d.mood=d.mood===v?0:v;});popFace();return;}
  if(ds.energy){const k=ds.key,v=+ds.energy;mutate(k,d=>{d.energy=d.energy===v?0:v;});return;}

  // goals
  if(ds.toggle){tickGoal(ds.key,ds.toggle,t.closest("li.goal"));return;}
  if(ds.step){stepGoal(ds.key,ds.gid,+ds.step,t.closest("li.goal"));return;}
  if(ds.del){
    // Clearing a finished goal keeps its credit in Insights; removing an unfinished one leaves no trace.
    mutate(ds.key,d=>{const g=d.goals.find(x=>x.id===ds.del);if(g&&g.done)d.gone=(d.gone||0)+1;d.goals=d.goals.filter(x=>x.id!==ds.del);});
    return;
  }
  if(ds.addGoal){const inp=t.closest(".goal-add").querySelector("input");if(addGoalText(ds.addGoal,inp.value))inp.value="";inp.focus();return;}
  if(ds.quick){const r=routine(ds.quick);if(r){r.lastUsed=Date.now();addGoalText(ds.key,r.text);}return;}
  if(ds.editGoal){
    const k=ds.key,g=getDay(k).goals.find(x=>x.id===ds.editGoal);if(!g)return;
    if(!g.rid||!routine(g.rid)){const r=findOrCreateRoutine(g.text);g.rid=r.id;save();}
    openRoutine(g.rid,k,g.id);return;
  }
  if(ds.move){
    const m=moveToTomorrow(null);
    if(m)toast("Moved "+m+" goal"+(m===1?"":"s")+" to tomorrow");
    return;
  }

  // long-term goals
  if(t.hasAttribute("data-new-long")){openLong(null);return;}
  if(ds.openLong){openLong(ds.openLong);return;}
  if(ds.lstep){
    const g=S.longs.find(x=>x.id===ds.lid);
    if(g)applyLong(g,g.prog+ +ds.lstep*(g.pct?5:1),t.closest(".lg"));
    return;
  }
  if(ds.slip){
    const g=S.longs.find(x=>x.id===ds.slip);if(!g)return;
    if(!ds.sure){ds.sure="1";t.textContent="Tap again to reset";return;}
    if(t.closest("#sheet2")){slipStreak(g,null);closeSheet(2);}else slipStreak(g,t.closest(".sk"));
    return;
  }
  if(ds.lPct&&editL){
    if(ds.lPct==="s"){if(editL.kind!=="streak"){editL.kind="streak";renderLong();}return;}
    const pct=ds.lPct==="1";if(editL.kind!=="streak"&&pct===editL.pct)return;
    const from=draftMax(editL)||10;
    editL.kind="prog";editL.pct=pct;
    editL.prog=Math.round(editL.prog/from*(draftMax(editL)||10)); // keep the same share done
    renderLong();return;
  }
  if(t.hasAttribute("data-l-save")&&editL){
    const was=editL.done,g=commitLong();
    if(g){toast(g.doneAt&&!was?"Goal complete. Nice work.":"Goal saved");closeSheet(2);if(g.doneAt&&!was)confetti();}
    return;
  }
  if(t.hasAttribute("data-l-done")&&editL){
    const max=draftMax(editL),was=editL.done;
    if(!max){toast("Set a target of 2 or more.");return;}
    editL.prog=was?Math.min(editL.prog,max-1):max;
    if(commitLong()){toast(was?"Goal reopened":"Goal complete. Nice work.");closeSheet(2);if(!was)confetti();}
    return;
  }
  if(t.hasAttribute("data-l-delete")&&editL){
    if(!ds.sure){ds.sure="1";t.textContent="Tap again to delete";return;}
    S.longs=S.longs.filter(x=>x.id!==editL.id);save();toast("Goal deleted");closeSheet(2);return;
  }

  // saved goals & goal settings
  if(t.hasAttribute("data-open-saved")){openSaved();return;}
  if(ds.openRoutine){openRoutine(ds.openRoutine,null);return;}
  if(t.hasAttribute("data-add-routine")){
    const inp=$("[data-new-routine]"),v=inp.value.trim();if(!v){inp.focus();return;}
    if(S.routines.some(x=>x.text.toLowerCase()===v.toLowerCase())){toast("That goal is already saved.");return;}
    const r=cleanRoutine({text:v,freq:"once"});S.routines.push(r);save();openRoutine(r.id,null);return;
  }
  if(ds.rFreq&&editR){editR.freq=ds.rFreq;if(editR.freq==="custom"&&!editR.days.length)editR.days=[parseKey(TODAY).getDay()];renderRoutine();return;}
  if(ds.rDay&&editR){const d=+ds.rDay;editR.days=editR.days.includes(d)?editR.days.filter(x=>x!==d):editR.days.concat(d);renderRoutine();return;}
  if(t.hasAttribute("data-r-save")){
    const R=editR,r=commitRoutine();
    if(r){
      const cal=calPending(R)&&!pushOn;
      toast("Goal saved");closeSheet(2);
      if(cal)openGcal(r,R.ctx);
    }
    return;
  }
  if(t.hasAttribute("data-r-gcal")){
    lockPause();
    // Save first, then let the link itself open Google Calendar.
    const r=commitRoutine();
    if(!r||!r.time){e.preventDefault();return;}
    editR.calSig=remSig(r);syncRemind();t.href=gcalUrl(r,editR.ctx);
    return;
  }
  if(t.hasAttribute("data-r-cal")){
    const r=commitRoutine();
    if(r&&r.time){editR.calSig=remSig(r);syncRemind();openIcs([vevent(r,editR.ctx)],slug(r.text));}
    return;
  }
  if(t.hasAttribute("data-r-move")&&editR){
    const gid=editR.gid;
    if(commitRoutine()){const m=moveToTomorrow([gid]);closeSheet(2);toast(m?"Moved to tomorrow":"Goal saved");}
    return;
  }
  if(t.hasAttribute("data-r-delete")&&editR){
    S.routines=S.routines.filter(x=>x.id!==editR.id);save();
    toast("Removed from saved goals. It stays on any lists it's already on.");closeSheet(2);return;
  }
  if(t.hasAttribute("data-cal-all")){
    const rs=S.routines.filter(r=>r.time&&r.freq!=="once");
    if(rs.length)openIcs(rs.map(r=>vevent(r,null)),"stoa-reminders");return;
  }

  // quotes
  if(t.hasAttribute("data-new-quote")){openQuote(null);return;}

  // open notes
  if(t.hasAttribute("data-new-note")){openNote(null);return;}
  if(ds.openNote){openNote(ds.openNote);return;}

  // photos
  if(ds.photo){pickPhoto(ds.photo);return;}
  if(t.hasAttribute("data-ph-text")){photoToText(t);return;}
  if(t.hasAttribute("data-ph-keep")){photoKeep(t);return;}
  if(ds.phOpen){openViewer(ds.phOpen,ds.phOwner);return;}
  if(t.hasAttribute("data-v-close")){closeViewer();return;}
  if(t.hasAttribute("data-v-delete")&&viewing){
    if(!ds.sure){ds.sure="1";t.textContent="Tap again to delete";return;}
    deleteViewed();return;
  }
  if(t.hasAttribute("data-n-done")){closeNote();return;}
  if(t.hasAttribute("data-n-delete")&&editN){
    if(!ds.sure){ds.sure="1";t.textContent="Tap again";t.style.color="var(--accent)";return;}
    const gone=S.notes.find(x=>x.id===editN);
    if(gone)gone.photos.forEach(id=>forgetPhoto(id));
    S.notes=S.notes.filter(x=>x.id!==editN);editN=null;save();toast("Note deleted");closeNote();return;
  }

  if(ds.editQuote){openQuote(ds.editQuote);return;}
  if(ds.fav){const q=S.quotes.find(x=>x.id===ds.fav);if(q){q.fav=!q.fav;save();renderAll();const h=$$("[data-fav]").find(b=>b.dataset.fav===ds.fav);if(h&&q.fav)h.classList.add("pop");}return;}
  if(ds.qopen){
    const box=$(".qnote",t.parentNode),open=!qOpen.has(ds.qopen);
    if(open)qOpen.add(ds.qopen);else qOpen.delete(ds.qopen);
    t.setAttribute("aria-expanded",open);
    if(open)expand(box);else collapse(box);
    return;
  }
  if(ds.qfilter){quoteFilter=ds.qfilter;renderQuotes();return;}
  if(t.hasAttribute("data-next-quote")){qShift++;renderQuotes();updateQuoteStrip();return;}
  if(t.hasAttribute("data-q-save")){
    const text=$("[data-q-text]").value.trim(),author=$("[data-q-author]").value.trim(),note=$("[data-q-note]").value.trim();
    if(!text){toast("Type the quote first.");$("[data-q-text]").focus();return;}
    if(editQ){const q=S.quotes.find(x=>x.id===editQ);if(q){q.text=text;q.author=author;q.note=note;}}
    else S.quotes.push(cleanQuote({text,author,note}));
    save();toast(editQ?"Quote updated":"Quote saved");closeSheet(2);return;
  }
  if(t.hasAttribute("data-q-delete")&&editQ){S.quotes=S.quotes.filter(x=>x.id!==editQ);editQ=null;save();toast("Quote deleted");closeSheet(2);return;}

  // settings
  if(t.hasAttribute("data-open-settings")){openSettings();return;}
  if(ds.sTheme){S.settings.theme=ds.sTheme;save();themeFade();applyTheme();$$("[data-s-theme]").forEach(b=>b.setAttribute("aria-checked",b.dataset.sTheme===ds.sTheme));return;}
  if(t.hasAttribute("data-export")){exportData();return;}
  if(t.hasAttribute("data-push-on")){pushEnable();return;}
  if(t.hasAttribute("data-push-off")){pushDisable();return;}
  if(t.hasAttribute("data-push-test")){pushTest();return;}

  // calendar nav
  if(ds.cal){cal.m+=+ds.cal;if(cal.m<0){cal.m=11;cal.y--;}if(cal.m>11){cal.m=0;cal.y++;}renderCal();const g=$(".cal");if(g)g.classList.add("fade");return;}

  // welcome
  if(t.hasAttribute("data-w-go")){finishWelcome($("[data-w-name]").value);return;}
  if(t.hasAttribute("data-w-skip")){finishWelcome("");return;}
});

document.addEventListener("keydown",e=>{
  if(lockMode){
    // While the passcode screen is up, the keyboard only types digits.
    if(/^[0-9]$/.test(e.key)){e.preventDefault();kpDigit(e.key);}
    else if(e.key==="Backspace"){e.preventDefault();kpDel();}
    return;
  }
  if(e.key==="Escape"){if(viewing)closeViewer();else if(noteOpen)closeNote();else if(sheetOpen[2])closeSheet(2);else if(sheetOpen[1])closeSheet(1);return;}
  if(e.key!=="Enter"||e.isComposing)return;
  const gi=e.target.closest&&e.target.closest("input[data-goal-input]");
  if(gi){e.preventDefault();if(addGoalText(gi.dataset.goalInput,gi.value))gi.value="";return;}
  if(e.target.matches("[data-new-routine]")){e.preventDefault();$("[data-add-routine]").click();return;}
  if(e.target.matches("[data-w-name]")){e.preventDefault();finishWelcome(e.target.value);return;}
  if(e.target.matches("[data-r-text],[data-s-name],[data-l-text],[data-r-target],[data-r-prog],[data-l-target],[data-lnum]")){e.preventDefault();e.target.blur();}
});

const saveLabels={};
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.matches("textarea[data-text]")){
    const k=el.dataset.text;
    autosize(el);
    mutate(k,d=>{d.text=el.value;},true);
    $$('textarea[data-text="'+k+'"]').forEach(o=>{if(o!==el){o.value=el.value;autosize(o);}});
    $$('[data-save="'+k+'"]').forEach(s=>s.textContent="Saving…");
    clearTimeout(saveLabels[k]);
    saveLabels[k]=setTimeout(()=>$$('[data-save="'+k+'"]').forEach(s=>s.textContent="Saved"),600);
    return;
  }
  if(el.matches("[data-search]")){renderJournal();return;}
  if(el.matches("[data-lnum]")){
    // Typing moves the bar straight away; the figure is saved when the box is left.
    const g=S.longs.find(x=>x.id===el.dataset.lnum);
    if(g&&el.value.trim()!=="")showLong(el.closest(".lg"),g,clamp(el.value,g.target));
    return;
  }
  if(el.matches("[data-n-text]")){writeNote(el.value);return;}
  if(el.matches("[data-r-text]")&&editR){editR.text=el.value;return;}
  if(el.matches("[data-r-target]")&&editR){editR.target=el.value;return;}
  if(el.matches("[data-r-prog]")&&editR){editR.prog=el.value;return;}
  if(editL){
    if(el.matches("[data-l-text]")){editL.text=el.value;return;}
    if(el.matches("[data-l-due]")){editL.due=el.value;return;}
    if(el.matches("[data-l-since]")){editL.since=el.value;return;}
    if(el.matches("[data-l-prog]")){editL.prog=+el.value;syncLong();return;}
    if(el.matches("[data-l-target]")){
      editL.target=el.value;
      const m=draftMax(editL),r=$("[data-l-prog]");
      if(m&&r){r.max=m;editL.prog=Math.min(editL.prog,m);r.value=editL.prog;}
      syncLong();return;
    }
  }
  if(el.matches("[data-r-time]")&&editR){editR.time=el.value||"08:00";syncRemind();return;}
  if(el.matches("[data-s-name]")){S.profile.name=el.value.trim().slice(0,40);S.profile.onboarded=true;saveSoon();updateHeader();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches("[data-r-track]")&&editR){editR.track=el.checked;const m=$("[data-r-trackmore]");if(m){m.hidden=!el.checked;m.classList.toggle("reveal",el.checked);}return;}
  if(el.matches("[data-l-due]")&&editL){editL.due=el.value;return;}
  if(el.matches("[data-l-since]")&&editL){editL.since=el.value;return;}
  if(el.matches("[data-lnum]")){
    const g=S.longs.find(x=>x.id===el.dataset.lnum);if(!g)return;
    if(el.value.trim()===""){el.value=g.prog;showLong(el.closest(".lg"),g,g.prog);return;} // left empty: keep what was there
    const v=clamp(el.value,g.target);
    el.value=v;applyLong(g,v,el.closest(".lg"));
    return;
  }
  // Show or hide in place: rebuilding the sheet here would close the iPhone time picker mid-scroll.
  if(el.matches("[data-r-remind]")&&editR){
    editR.remind=el.checked;
    const m=$("[data-r-more]");if(m){m.hidden=!el.checked;m.classList.toggle("reveal",el.checked);}
    syncRemind();return;
  }
  if(el.matches("[data-r-time]")&&editR){editR.time=el.value||"08:00";syncRemind();return;}
  if(el.matches("[data-import]")){const f=el.files&&el.files[0];if(f)importData(f);el.value="";}
  if(el.matches("[data-bio]")){
    if(el.checked)bioEnable().then(ok=>{toast(ok?"Face ID is on.":"Face ID couldn't be set up here.");lockRefresh();});
    else{const c=lockConf();if(c){delete c.bio;localStorage.setItem(LOCK_KEY,JSON.stringify(c));}toast("Face ID is off.");lockRefresh();}
    return;
  }
  if(el.id==="photo-input"){photoChosen(el.files&&el.files[0]);return;}
});

function checkDate(){
  const k=keyOf(new Date());
  if(k!==TODAY){TODAY=k;qShift=0;renderToday();renderAll();}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){if(saveTimer)save();return;}
  checkDate();renderAll();
});
window.addEventListener("pagehide",()=>{if(saveTimer)save();});
window.addEventListener("resize",()=>$$("textarea[data-text]").forEach(autosize));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
// No pinch zoom: iPhone ignores the viewport setting on its own, so stop the gesture too.
document.addEventListener("gesturestart",e=>e.preventDefault());
if(window.visualViewport){visualViewport.addEventListener("resize",fitComposer);visualViewport.addEventListener("scroll",fitComposer);}
// Lets the :active press states show on iPhone.
document.addEventListener("touchstart",()=>{},{passive:true});
setInterval(()=>{
  checkDate();
  if(document.visibilityState!=="visible"||document.activeElement.matches("input,textarea"))return;
  $$("[data-goal-list]").forEach(el=>updateGoals(el.dataset.goalList));
  if(currentTab==="goals"&&!slide&&!sheetOpen[2]&&S.longs.some(g=>g.kind==="streak"))renderLongs();
},60000);

/* =========================================================
   Start
   ========================================================= */
applyTheme();
if(lockConf())showLock("unlock");
renderToday();
buildJournal();
buildInsights();
switchTab("today");
if(!S.profile.onboarded)showWelcome();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
if(pushCapable)pushSync().then(pushRefresh);
})();
</script>
</body>
</html>
